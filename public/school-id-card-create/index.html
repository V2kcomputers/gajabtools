<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School ID Create</title>
<style>
    body{font-family:Arial;background:#f3f3f3}.container{max-width:1100px;margin:auto;background:#fff;padding:20px}
input,button{padding:10px;margin:5px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}
</style>
</head>
<body>
<div class="container">
<h2>School ID Create</h2>

<section class="school">
<h3>School Information</h3>
<input id="schoolName" placeholder="School Name">
<button id="logoBtn">Select Logo (/upload/)</button>
<button id="signBtn">Select Signature (/upload/)</button>
</section>

<section class="student">
<h3>Add Student</h3>
<input id="studentName" placeholder="Student Name">
<input id="fatherName" placeholder="Father Name">
<input id="className" placeholder="Class">
<input id="mobile" placeholder="Mobile">
<button id="photoBtn">Select Photo (/upload/)</button>
<button id="addStudent">Add Student</button>
</section>

<table id="studentsTable">
<thead><tr><th>Name</th><th>Father</th><th>Class</th><th>Photo ID</th><th>Action</th></tr></thead>
<tbody></tbody>
</table>

<button id="generate">Generate Cards</button>
</div>

<script>

const students=[];
let currentPhotoId=null;

document.getElementById('photoBtn').onclick=()=>{
 alert('Open /upload/ in iframe and receive imageId via postMessage.');
};

window.addEventListener('message',(e)=>{
 if(e.data?.type==='image-selected'){
   currentPhotoId=e.data.id;
   alert('Photo Selected ID: '+currentPhotoId);
 }
});

document.getElementById('addStudent').onclick=()=>{
 const s={
  name:studentName.value,
  father:fatherName.value,
  className:className.value,
  mobile:mobile.value,
  photoId:currentPhotoId
 };
 students.push(s);
 render();
};

function render(){
 const tb=document.querySelector('#studentsTable tbody');
 tb.innerHTML='';
 students.forEach((s,i)=>{
  tb.innerHTML+=`<tr>
   <td>${s.name}</td>
   <td>${s.father}</td>
   <td>${s.className}</td>
   <td>${s.photoId??''}</td>
   <td><button onclick="students.splice(${i},1);render()">Delete</button></td>
  </tr>`;
 });
}

document.getElementById('generate').onclick=()=>{
 const token=crypto.randomUUID();
 const db={school:{name:schoolName.value},students};
 localStorage.setItem('school-batch-'+token,JSON.stringify(db));
 location.href='/school-id-view/?token='+token;
};


</script>
</body>
</html>
