<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Image Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .sticky-header { background-color: #1e293b; padding: 12px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
        .workspace { flex: 1; display: flex; overflow: hidden; position: relative; }
        .canvas-area { flex: 3; display: flex; align-items: center; justify-content: center; background-color: #090d16; padding: 20px; position: relative; overflow: auto; }
        .controls-sidebar { flex: 1; max-width: 400px; background-color: #1e293b; border-left: 1px solid #334155; overflow-y: auto; padding: 20px; height: 100%; }
        .control-group { background: #111827; padding: 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #334155; }
        .control-group label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #94a3b8; display: flex; justify-content: space-between; }
        .form-range { height: 6px; }
        .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-preset { background: #334155; border: none; color: #fff; font-size: 11px; padding: 6px; border-radius: 4px; transition: all 0.2s; }
        .btn-preset:hover { background: #2563eb; }
        .crop-container { max-width: 100%; max-height: 70vh; display: none; }
        .bg-color-dot { width: 24px; height: 24px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid #fff; }
        
         
        .ai-progress-container { display: none; margin-top: 10px; background: #111827; border: 1px solid #334155; padding: 10px; border-radius: 6px; }
        .bg-options-panel { display: none; }

        @media (max-width: 991px) {
            .workspace { flex-direction: column; overflow-y: auto; }
            .controls-sidebar { max-width: 100%; border-left: none; border-top: 1px solid #334155; }
            .canvas-area { min-height: 400px; }
        }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-light btn-sm d-flex align-items-center gap-1" onclick="handleCancel()"><span class="material-icons fs-6">arrow_back</span> Back</button>
            <h5 class="m-0 fw-bold d-none d-sm-block">Professional Image Editor</h5>
            <span class="badge bg-secondary" id="filenameBadge">Original Resolution</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-danger btn-sm" onclick="handleCancel()">Cancel</button>
            <button class="btn btn-success btn-sm px-3 fw-bold" onclick="handleApply()"><span class="material-icons align-middle fs-6">check</span> Apply</button>
        </div>
    </header>

    <div class="workspace">
        <div class="canvas-area">
            <div id="canvasParent" style="position: relative;">
                <canvas id="mainCanvas"></canvas>
                <img id="cropperTarget" class="crop-container" alt="Cropper Node Source">
            </div>
        </div>

        <aside class="controls-sidebar">
            <ul class="nav nav-tabs mb-3 border-secondary" id="editorTabs">
                <li class="nav-item"><button class="nav-link active text-white bg-dark border-0" data-bs-toggle="tab" data-bs-target="#tabBasic">Basic</button></li>
                <li class="nav-item"><button class="nav-link text-white bg-dark border-0 ms-1" data-bs-toggle="tab" data-bs-target="#tabTransform">Crop</button></li>
                <li class="nav-item"><button class="nav-link text-white bg-dark border-0 ms-1" data-bs-toggle="tab" data-bs-target="#tabPassport">Passport</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tabBasic">
                    <div class="mb-3">
                        <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 fw-bold remove-bg-trigger" onclick="runBackgroundRemoval()">
                            <span class="material-icons fs-5 bg-btn-icon">auto_fix_high</span>
                            <span class="bg-btn-text">Remove Background (Free AI)</span>
                        </button>
                    </div>

                    <div class="control-group">
                        <label>Brightness <span id="val_brightness">100</span></label>
                        <input type="range" class="form-range" id="slider_brightness" min="0" max="200" value="100" oninput="applyFilters()">
                    </div>
                    <div class="control-group">
                        <label>Contrast <span id="val_contrast">100</span></label>
                        <input type="range" class="form-range" id="slider_contrast" min="0" max="200" value="100" oninput="applyFilters()">
                    </div>
                    <div class="control-group">
                        <label>Saturation <span id="val_saturation">100</span></label>
                        <input type="range" class="form-range" id="slider_saturation" min="0" max="200" value="100" oninput="applyFilters()">
                    </div>
                    <div class="control-group">
                        <label>Blur <span id="val_blur">0</span></label>
                        <input type="range" class="form-range" id="slider_blur" min="0" max="100" value="0" oninput="applyFilters()">
                    </div>
                    <div class="control-group">
                        <label>Color Filters</label>
                        <div class="preset-grid mt-2">
                            <button class="btn-preset" onclick="setFilterPreset('grayscale')">Grayscale</button>
                            <button class="btn-preset" onclick="setFilterPreset('sepia')">Sepia</button>
                            <button class="btn-preset" onclick="setFilterPreset('invert')">Negative</button>
                        </div>
                    </div>
                    <button class="btn btn-danger w-100 mt-2" onclick="resetAllEffects()">Reset All</button>
                </div>

                <div class="tab-pane fade" id="tabTransform">
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-sm btn-outline-light w-50" onclick="rotateImage(-90)"><span class="material-icons align-middle">rotate_left</span> Left</button>
                        <button class="btn btn-sm btn-outline-light w-50" onclick="rotateImage(90)"><span class="material-icons align-middle">rotate_right</span> Right</button>
                    </div>
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-sm btn-outline-light w-50" onclick="flipImage('h')">Flip Horiz</button>
                        <button class="btn btn-sm btn-outline-light w-50" onclick="flipImage('v')">Flip Vert</button>
                    </div>
                    <button class="btn btn-warning w-100 fw-bold text-dark" id="cropToggleBtn" onclick="toggleCropMode()">Start Crop Tool</button>
                </div>

                <div class="tab-pane fade" id="tabPassport">
                    <div class="mb-3">
                        <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 fw-bold remove-bg-trigger" onclick="runBackgroundRemoval()">
                            <span class="material-icons fs-5 bg-btn-icon">auto_fix_high</span>
                            <span class="bg-btn-text">Remove Background (Free AI)</span>
                        </button>
                    </div>

                    <h6>Passport Background Presets</h6>
                    <div class="d-flex gap-3 my-2">
                        <span class="bg-color-dot" style="background-color: #ffffff;" onclick="changeCanvasBackground('#ffffff')"></span>
                        <span class="bg-color-dot" style="background-color: #3b82f6;" onclick="changeCanvasBackground('#3b82f6')"></span>
                        <span class="bg-color-dot" style="background-color: #cbd5e1;" onclick="changeCanvasBackground('#cbd5e1')"></span>
                        <span class="bg-color-dot" style="background-color: transparent; border: 2px dashed #ccc;" onclick="changeCanvasBackground('transparent')"></span>
                    </div>
                    <h6 class="mt-4">Auto Passport Trimming</h6>
                    <div class="preset-grid mt-2">
                        <button class="btn-preset" onclick="triggerAutoPassportCrop(35/45)">35x45 mm</button>
                        <button class="btn-preset" onclick="triggerAutoPassportCrop(1)">Square (1:1)</button>
                        <button class="btn-preset" onclick="triggerAutoPassportCrop(3/4)">Ratio 3:4</button>
                    </div>
                </div>
            </div>

            <div class="ai-progress-container mt-3" id="aiProgressWrapper">
                <div class="d-flex align-items-center justify-content-between mb-1">
                    <span class="small text-info fw-bold" id="aiStatusText">Initializing AI Model...</span>
                    <div class="spinner-border spinner-border-sm text-info" role="status"></div>
                </div>
                <div class="progress" style="height: 6px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" id="aiProgressBar" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-options-panel mt-3" id="bgOptionsPanel">
                <div class="control-group">
                    <label class="mb-2">Instant Solid Color Preview</label>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="bg-color-dot" style="background-color: transparent; border: 2px dashed #bbb;" onclick="updateExtractedBg('transparent')" title="Transparent"></span>
                        <span class="bg-color-dot" style="background-color: #ffffff;" onclick="updateExtractedBg('#ffffff')" title="White"></span>
                        <span class="bg-color-dot" style="background-color: #3b82f6;" onclick="updateExtractedBg('#3b82f6')" title="Blue"></span>
                        <span class="bg-color-dot" style="background-color: #f1f5f9;" onclick="updateExtractedBg('#f1f5f9')" title="Light Gray"></span>
                        <span class="bg-color-dot" style="background-color: #ef4444;" onclick="updateExtractedBg('#ef4444')" title="Red"></span>
                        <input type="color" id="bgCustomColorPicker" class="form-control form-control-color border-0 p-0 bg-transparent" style="width:28px; height:28px;" value="#ff00ff" oninput="updateExtractedBg(this.value)" title="Custom Color">
                    </div>
                </div>

                <div class="control-group">
                    <label class="mb-1">Feather / Alpha Softening <span id="val_fth">0</span></label>
                    <input type="range" class="form-range refinement-slider" id="slide_feather" min="0" max="20" value="0">
                    
                    <label class="mb-1 mt-2">Edge Smoothness <span id="val_smth">1</span></label>
                    <input type="range" class="form-range refinement-slider" id="slide_smooth" min="1" max="9" step="2" value="1">

                    <label class="mb-1 mt-2">Edge Blur Radius <span id="val_blr">0</span></label>
                    <input type="range" class="form-range refinement-slider" id="slide_edgeBlur" min="0" max="10" value="0">

                    <label class="mb-1 mt-2">Hair Structure Recovery <span id="val_hair">0</span></label>
                    <input type="range" class="form-range refinement-slider" id="slide_hair" min="0" max="5" value="0">
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-warning w-50" onclick="undoBgRemoval()">Undo AI</button>
                    <button class="btn btn-sm btn-outline-danger w-50" onclick="resetBgRefinements()">Reset sliders</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>

    <script>
        let db, imgId, imgToken, fabricCanvas, cropperInstance = null;
        let originalImgObject = null;
        let currentRotation = 0, flipH = 1, flipV = 1;

        let imageStateBeforeAI = null; 
        let segmentAlphaMaskCanvas = null; 
        let currentExtractedBlobPNG = null;
        let activeBgColorFill = 'transparent';
        let originalImageDimensions = { width: 0, height: 0 };

        const urlParams = new URLSearchParams(window.location.search);
        imgId = parseInt(urlParams.get('id'));
        imgToken = urlParams.get('token');

        if (!imgToken || isNaN(imgId)) {
            alert("Image not found.");
            exitWorkspace();
        }

        const req = indexedDB.open("ImageLibrary", 2);
        req.onsuccess = (e) => {
            db = e.target.result;
            initEditorEngine();
        };
        req.onerror = () => exitWorkspace();

        function exitWorkspace() {
            if (window.self !== window.top) {
                window.parent.postMessage("edit_cancel", "*");
            } else {
                window.location.href = "/upload/";
            }
        }

        function initEditorEngine() {
            fabricCanvas = new fabric.Canvas('mainCanvas', { backgroundColor: 'transparent' });
            
            const tx = db.transaction("images", "readonly");
            const store = tx.objectStore("images");
            const query = store.get(imgId);

            query.onsuccess = () => {
                const item = query.result;
                if (!item || item.token !== imgToken) {
                    alert("Image token mismatch.");
                    exitWorkspace();
                    return;
                }

                document.getElementById('filenameBadge').innerText = item.name;

                const reader = new FileReader();
                reader.onload = function(event) {
                    fabric.Image.fromURL(event.target.result, function(img) {
                        originalImgObject = img;
                        originalImageDimensions.width = img.width;
                        originalImageDimensions.height = img.height;
                        
                        const maxW = window.innerWidth * 0.55;
                        const maxH = window.innerHeight * 0.70;
                        const scale = Math.min(maxW / img.width, maxH / img.height);

                        fabricCanvas.setWidth(img.width * scale);
                        fabricCanvas.setHeight(img.height * scale);
                        
                        img.set({
                            scaleX: scale, scaleY: scale,
                            left: fabricCanvas.width / 2, top: fabricCanvas.height / 2,
                            originX: 'center', originY: 'center',
                            selectable: true, hasControls: true
                        });
                        
                        fabricCanvas.add(img);
                        fabricCanvas.setActiveObject(img);
                        fabricCanvas.renderAll();
                    });
                };
                reader.readAsDataURL(item.blob);
            };

            setupShortcuts();
            initRefinementListeners();
        }

        function applyFilters() {
            const img = fabricCanvas.getActiveObject();
            if (!img) return;

            const b = parseFloat(document.getElementById('slider_brightness').value) / 100 - 1;
            const c = parseFloat(document.getElementById('slider_contrast').value) / 100 - 1;
            const s = parseFloat(document.getElementById('slider_saturation').value) / 100 - 1;
            const blurVal = parseFloat(document.getElementById('slider_blur').value) / 100;

            document.getElementById('val_brightness').innerText = document.getElementById('slider_brightness').value;
            document.getElementById('val_contrast').innerText = document.getElementById('slider_contrast').value;
            document.getElementById('val_saturation').innerText = document.getElementById('slider_saturation').value;
            document.getElementById('val_blur').innerText = document.getElementById('slider_blur').value;

            img.filters = img.filters.filter(f => f && !['Brightness', 'Contrast', 'Saturation', 'Blur'].includes(f.type));
            img.filters.push(new fabric.Image.filters.Brightness({ brightness: b }));
            img.filters.push(new fabric.Image.filters.Contrast({ contrast: c }));
            img.filters.push(new fabric.Image.filters.Saturation({ saturation: s }));
            if(blurVal > 0) img.filters.push(new fabric.Image.filters.Blur({ blur: blurVal }));

            img.applyFilters();
            fabricCanvas.renderAll();
        }

        function setFilterPreset(type) {
            const img = fabricCanvas.getActiveObject();
            if (!img) return;
            if(type === 'grayscale') img.filters.push(new fabric.Image.filters.Grayscale());
            if(type === 'sepia') img.filters.push(new fabric.Image.filters.Sepia());
            if(type === 'invert') img.filters.push(new fabric.Image.filters.Invert());
            img.applyFilters();
            fabricCanvas.renderAll();
        }

        function rotateImage(deg) {
            const img = fabricCanvas.getActiveObject();
            if (!img) return;
            currentRotation += deg;
            img.set('angle', currentRotation);
            fabricCanvas.renderAll();
        }

        function flipImage(dir) {
            const img = fabricCanvas.getActiveObject();
            if (!img) return;
            if (dir === 'h') { flipH = flipH === 1 ? -1 : 1; img.set('flipX', flipH === -1); }
            if (dir === 'v') { flipV = flipV === 1 ? -1 : 1; img.set('flipY', flipV === -1); }
            fabricCanvas.renderAll();
        }

        function changeCanvasBackground(color) {
            if(color === 'transparent') {
                fabricCanvas.setBackgroundColor('', fabricCanvas.renderAll.bind(fabricCanvas));
            } else {
                fabricCanvas.setBackgroundColor(color, fabricCanvas.renderAll.bind(fabricCanvas));
            }
        }

        function toggleCropMode() {
            const btn = document.getElementById('cropToggleBtn');
            const canvasEl = document.getElementById('mainCanvas').nextElementSibling; 
            const cropTarget = document.getElementById('cropperTarget');

            if (!cropperInstance) {
                const dataUrl = fabricCanvas.toDataURL({ format: 'png', quality: 1.0 });
                cropTarget.src = dataUrl;
                document.getElementById('mainCanvas').style.display = 'none';
                if(canvasEl) canvasEl.style.display = 'none';
                cropTarget.style.display = 'block';

                cropperInstance = new Cropper(cropTarget, {
                    viewMode: 1, dragMode: 'move', autoCropArea: 0.8, responsive: true
                });
                btn.innerText = "Commit Crop Selection";
                btn.className = "btn btn-success w-100 fw-bold";
            } else {
                const croppedCanvas = cropperInstance.getCroppedCanvas();
                cropperInstance.destroy();
                cropperInstance = null;

                cropTarget.style.display = 'none';
                document.getElementById('mainCanvas').style.display = 'block';
                if(canvasEl) canvasEl.style.display = 'block';

                originalImageDimensions.width = croppedCanvas.width;
                originalImageDimensions.height = croppedCanvas.height;

                fabric.Image.fromURL(croppedCanvas.toDataURL(), function(img) {
                    fabricCanvas.clear();
                    const maxW = window.innerWidth * 0.55;
                    const maxH = window.innerHeight * 0.70;
                    const scale = Math.min(maxW / img.width, maxH / img.height);
                    
                    fabricCanvas.setWidth(img.width * scale);
                    fabricCanvas.setHeight(img.height * scale);

                    img.set({ 
                        scaleX: scale, 
                        scaleY: scale, 
                        left: fabricCanvas.width/2, 
                        top: fabricCanvas.height/2, 
                        originX:'center', 
                        originY:'center' 
                    });
                    fabricCanvas.add(img);
                    fabricCanvas.setActiveObject(img);
                    fabricCanvas.renderAll();
                });

                btn.innerText = "Start Crop Tool";
                btn.className = "btn btn-warning w-100 text-dark fw-bold";
            }
        }

        function triggerAutoPassportCrop(ratio) {
            if(cropperInstance) { cropperInstance.setAspectRatio(ratio); return; }
            toggleCropMode();
            cropperInstance.setAspectRatio(ratio);
        }

        function resetAllEffects() {
            document.getElementById('slider_brightness').value = 100;
            document.getElementById('slider_contrast').value = 100;
            document.getElementById('slider_saturation').value = 100;
            document.getElementById('slider_blur').value = 0;
            currentRotation = 0; flipH = 1; flipV = 1;
            
            const img = fabricCanvas.getActiveObject();
            if(img) {
                img.filters = [];
                img.set({ angle: 0, flipX: false, flipY: false });
                img.applyFilters();
            }
            fabricCanvas.renderAll();
            applyFilters();
        }

        function setupShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') { e.preventDefault(); handleApply(); }
                if (e.key === 'Escape') { e.preventDefault(); handleCancel(); }
            });
        }

        function handleCancel() {
            exitWorkspace();
        }

        function setAIElementsRunning(isRunning, message = "", percent = 0) {
            const triggers = document.querySelectorAll('.remove-bg-trigger');
            triggers.forEach(btn => {
                const textSpan = btn.querySelector('.bg-btn-text');
                const iconSpan = btn.querySelector('.bg-btn-icon');
                if (isRunning) {
                    btn.disabled = true;
                    if(textSpan) textSpan.innerText = "Removing...";
                    if(iconSpan) iconSpan.innerText = "hourglass_empty";
                } else {
                    btn.disabled = false;
                    if(textSpan) textSpan.innerText = message || "Remove Background (Free AI)";
                    if(iconSpan) iconSpan.innerText = message.includes("✓") ? "check_circle" : "auto_fix_high";
                }
            });

            const wrapper = document.getElementById('aiProgressWrapper');
            const bar = document.getElementById('aiProgressBar');
            const txt = document.getElementById('aiStatusText');
            
            if (isRunning) {
                wrapper.style.display = 'block';
                txt.innerText = message;
                bar.style.width = percent + "%";
            } else {
                if(!message) wrapper.style.display = 'none';
                else {
                    txt.innerText = message;
                    bar.style.width = "100%";
                }
            }
        }

        async function runBackgroundRemoval() {
            const activeObject = fabricCanvas.getActiveObject();
            if (!activeObject) {
                alert("Please select or load an image first.");
                return;
            }

            setAIElementsRunning(true, "Extracting asset data...", 15);
            imageStateBeforeAI = activeObject.toDataURL({ format: 'png', quality: 1.0 });

            const rawImgNode = new Image();
            rawImgNode.crossOrigin = "anonymous";
            rawImgNode.src = activeObject.toObject().src || activeObject.toDataURL({ format: 'png', quality: 1.0 });

            rawImgNode.onload = async () => {
                try {
                    setAIElementsRunning(true, "Executing AI Segmentation Model...", 40);
                    if (window.SelfieSegmentation) {
                        await runMediaPipeSegmentation(rawImgNode);
                    } else {
                        setAIElementsRunning(true, "MediaPipe offline. Trying BodyPix Fallback...", 55);
                        await runBodyPixFallback(rawImgNode);
                    }
                } catch (err) {
                    console.error(err);
                    setAIElementsRunning(false, "Processing Failure!");
                    alert("Local AI Engine failed execution: " + err.message);
                }
            };
        }

        function runMediaPipeSegmentation(imageElement) {
            return new Promise((resolve, reject) => {
                let instanceCompleted = false;
                const selfieSegmentation = new SelfieSegmentation({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
                });

                selfieSegmentation.setOptions({ modelSelection: 1 });
                selfieSegmentation.onResults((results) => {
                    if (instanceCompleted) return;
                    
                    if (results && results.segmentationMask) {
                        instanceCompleted = true;
                        setAIElementsRunning(true, "Refining transparency map...", 85);
                        
                        segmentAlphaMaskCanvas = document.createElement('canvas');
                        segmentAlphaMaskCanvas.width = imageElement.width;
                        segmentAlphaMaskCanvas.height = imageElement.height;
                        const ctx = segmentAlphaMaskCanvas.getContext('2d');
                        ctx.drawImage(results.segmentationMask, 0, 0, imageElement.width, imageElement.height);

                        if (isMaskEmpty(segmentAlphaMaskCanvas)) {
                            setAIElementsRunning(false, "No human detected.");
                            alert("No human detected in this image.");
                            reject(new Error("Empty detection structure profile."));
                            return;
                        }

                        renderRefinedMatte(imageElement);
                        setAIElementsRunning(false, "Background Removed ✓");
                        document.getElementById('bgOptionsPanel').style.display = 'block';
                        resolve();
                    } else {
                        reject(new Error("MediaPipe output format error."));
                    }
                });

                selfieSegmentation.send({ image: imageElement }).catch(reject);
            });
        }

        async function runBodyPixFallback(imageElement) {
            const net = await bodyPix.load({
                architecture: 'MobileNetV1', outputStride: 16, multiplier: 0.75, quantBytes: 2
            });
            setAIElementsRunning(true, "Evaluating human contours...", 70);
            
            const segmentation = await net.segmentPerson(imageElement, {
                internalResolution: 'high', segmentationThreshold: 0.5
            });

            if(!segmentation || segmentation.data.length === 0) {
                setAIElementsRunning(false, "No human detected.");
                alert("No human detected in this image.");
                return;
            }

            segmentAlphaMaskCanvas = document.createElement('canvas');
            segmentAlphaMaskCanvas.width = imageElement.width;
            segmentAlphaMaskCanvas.height = imageElement.height;
            const ctx = segmentAlphaMaskCanvas.getContext('2d');
            const imgData = ctx.createImageData(imageElement.width, imageElement.height);

            for (let i = 0; i < segmentation.data.length; i++) {
                imgData.data[i * 4] = 255;   
                imgData.data[i * 4 + 1] = 255; 
                imgData.data[i * 4 + 2] = 255; 
                imgData.data[i * 4 + 3] = segmentation.data[i] ? 255 : 0; 
            }
            ctx.putImageData(imgData, 0, 0);

            renderRefinedMatte(imageElement);
            setAIElementsRunning(false, "Background Removed ✓");
            document.getElementById('bgOptionsPanel').style.display = 'block';
        }

        function isMaskEmpty(canvas) {
            const ctx = canvas.getContext('2d');
            const buffer = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            for (let i = 3; i < buffer.length; i += 32) { 
                if (buffer[i] > 20) return false;
            }
            return true;
        }

        function initRefinementListeners() {
            document.querySelectorAll('.refinement-slider').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const id = e.target.id;
                    const val = e.target.value;
                    if(id === 'slide_feather') document.getElementById('val_fth').innerText = val;
                    if(id === 'slide_smooth') document.getElementById('val_smth').innerText = val;
                    if(id === 'slide_edgeBlur') document.getElementById('val_blr').innerText = val;
                    if(id === 'slide_hair') document.getElementById('val_hair').innerText = val;

                    const activeObject = fabricCanvas.getActiveObject();
                    if(activeObject && originalImgObject) {
                        const originalImageNode = originalImgObject._element;
                        renderRefinedMatte(originalImageNode);
                    }
                });
            });
        }

        function renderRefinedMatte(nativeImageNode) {
            if (!segmentAlphaMaskCanvas) return;

            const w = nativeImageNode.width;
            const h = nativeImageNode.height;

            const feather = parseInt(document.getElementById('slide_feather').value);
            const smooth = parseInt(document.getElementById('slide_smooth').value);
            const edgeBlur = parseInt(document.getElementById('slide_edgeBlur').value);
            const hairDetail = parseInt(document.getElementById('slide_hair').value);

            const pipelineCanvas = document.createElement('canvas');
            pipelineCanvas.width = w;
            pipelineCanvas.height = h;
            const pCtx = pipelineCanvas.getContext('2d');

            pCtx.filter = `blur(${edgeBlur}px)`;
            pCtx.drawImage(segmentAlphaMaskCanvas, 0, 0, w, h);
            pCtx.filter = 'none';

            const maskData = pCtx.getImageData(0, 0, w, h);
            
            const compositingCanvas = document.createElement('canvas');
            compositingCanvas.width = w;
            compositingCanvas.height = h;
            const cCtx = compositingCanvas.getContext('2d');
            cCtx.drawImage(nativeImageNode, 0, 0, w, h);
            const srcData = cCtx.getImageData(0, 0, w, h);

            for (let i = 0; i < srcData.data.length; i += 4) {
                let alpha = maskData.data[i + 3];

                if(feather > 0) {
                    alpha = alpha - feather;
                    if(alpha < 0) alpha = 0;
                }

                if (smooth > 1) {
                    let normalized = alpha / 255;
                    normalized = 1 / (1 + Math.exp(-smooth * (normalized - 0.5)));
                    alpha = normalized * 255;
                }

                if (alpha < 240 && alpha > 15 && hairDetail > 0) {
                    srcData.data[i] = Math.max(0, srcData.data[i] - hairDetail * 4);
                    srcData.data[i+1] = Math.max(0, srcData.data[i+1] - hairDetail * 4);
                    srcData.data[i+2] = Math.max(0, srcData.data[i+2] - hairDetail * 4);
                }

                srcData.data[i + 3] = alpha; 
            }

            cCtx.putImageData(srcData, 0, 0);

            const activeObject = fabricCanvas.getActiveObject();
            const currentScaleX = activeObject.scaleX;
            const currentScaleY = activeObject.scaleY;
            const currentLeft = activeObject.left;
            const currentTop = activeObject.top;

            pipelineCanvas.width = w;
            pipelineCanvas.height = h;
            const finalCtx = pipelineCanvas.getContext('2d');

            if(activeBgColorFill !== 'transparent') {
                finalCtx.fillStyle = activeBgColorFill;
                finalCtx.fillRect(0, 0, w, h);
            }
            finalCtx.drawImage(compositingCanvas, 0, 0);

            pipelineCanvas.toBlob((blob) => {
                currentExtractedBlobPNG = blob;
            }, 'image/png');

            fabric.Image.fromURL(pipelineCanvas.toDataURL(), (newFabricImg) => {
                newFabricImg.set({
                    scaleX: currentScaleX, scaleY: currentScaleY,
                    left: currentLeft, top: currentTop,
                    originX: 'center', originY: 'center',
                    selectable: true, hasControls: true
                });

                fabricCanvas.remove(activeObject);
                fabricCanvas.add(newFabricImg);
                fabricCanvas.setActiveObject(newFabricImg);
                fabricCanvas.renderAll();
            });
        }

        function updateExtractedBg(colorStyle) {
            activeBgColorFill = colorStyle;
            if(originalImgObject) {
                renderRefinedMatte(originalImgObject._element);
                if(colorStyle !== 'transparent') {
                    changeCanvasBackground(colorStyle);
                } else {
                    changeCanvasBackground('transparent');
                }
            }
        }

        function undoBgRemoval() {
            if (!imageStateBeforeAI) return;
            
            const activeObject = fabricCanvas.getActiveObject();
            const currentScaleX = activeObject.scaleX;
            const currentScaleY = activeObject.scaleY;
            const currentLeft = activeObject.left;
            const currentTop = activeObject.top;

            fabric.Image.fromURL(imageStateBeforeAI, (restoredImg) => {
                restoredImg.set({
                    scaleX: currentScaleX, scaleY: currentScaleY,
                    left: currentLeft, top: currentTop,
                    originX: 'center', originY: 'center'
                });
                fabricCanvas.remove(activeObject);
                fabricCanvas.add(restoredImg);
                fabricCanvas.setActiveObject(restoredImg);
                fabricCanvas.renderAll();
            });

            document.getElementById('bgOptionsPanel').style.display = 'none';
            setAIElementsRunning(false, "AI Process Undone");
        }

        function resetBgRefinements() {
            document.getElementById('slide_feather').value = 0;
            document.getElementById('slide_smooth').value = 1;
            document.getElementById('slide_edgeBlur').value = 0;
            document.getElementById('slide_hair').value = 0;
            
            document.getElementById('val_fth').innerText = "0";
            document.getElementById('val_smth').innerText = "1";
            document.getElementById('val_blr').innerText = "0";
            document.getElementById('val_hair').innerText = "0";

            if(originalImgObject) {
                renderRefinedMatte(originalImgObject._element);
            }
        }

        function checkHasTransparency(ctx, w, h) {
            const buffer = ctx.getImageData(0, 0, w, h).data;
            for (let i = 3; i < buffer.length; i += 4) {
                if (buffer[i] < 255) return true;
            }
            return false;
        }

        function handleApply() {
            if(cropperInstance) { toggleCropMode(); } 

            const w = originalImageDimensions.width;
            const h = originalImageDimensions.height;

            const nativeBakingCanvas = document.createElement('canvas');
            nativeBakingCanvas.width = w;
            nativeBakingCanvas.height = h;
            const nCtx = nativeBakingCanvas.getContext('2d');

            const currentFabricStateURL = fabricCanvas.toDataURL({ format: 'png', quality: 1.0 });
            const temporaryImageNode = new Image();
            temporaryImageNode.src = currentFabricStateURL;

            temporaryImageNode.onload = () => {
                nCtx.drawImage(temporaryImageNode, 0, 0, w, h);
                
                const hasTransparency = (activeBgColorFill === 'transparent') && checkHasTransparency(nCtx, w, h);
                const exportMime = hasTransparency ? 'image/png' : 'image/jpeg';
                
                nativeBakingCanvas.toBlob((editedBlob) => {
                    const tx = db.transaction("images", "readwrite");
                    const store = tx.objectStore("images");
                    const query = store.get(imgId);

                    query.onsuccess = () => {
                        const item = query.result;
                        if(item && item.token === imgToken) {
                            item.blob = editedBlob;
                            item.mime = exportMime;
                            item.size = editedBlob.size;
                            item.width = w;
                            item.height = h;
                            item.edited = true;
                            item.editedDate = new Date().toISOString();
                            
                            store.put(item);
                            tx.oncomplete = () => {
                                if (window.self !== window.top) {
                                    
                                    window.parent.postMessage({ type: "edit_complete", id: imgId }, "*");
                                } else {
                                    window.location.href = "/upload/";
                                }
                            };
                        } else {
                            exitWorkspace();
                        }
                    };
                }, exportMime, 1.0);
            };
        }
    </script>
