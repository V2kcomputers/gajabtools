<body>

<div class="top-bar">
    <div class="title-box">
        <h1>🖼️ Image Library</h1>
        <p>Upload, Crop & Manage Images</p>
    </div>
</div>

<div id="drop">
    <div class="upload-content">
        <div class="upload-icon">☁️</div>
        <h3>Drag & Drop Images</h3>
        <p>Upload JPG, PNG, WEBP Images</p>
        <label class="upload-btn">
            Select Images
            <input type="file" id="files" multiple accept="image/*" hidden>
        </label>
    </div>
</div>
<br>
<div class="search-box">
    <input type="text" id="search" placeholder="🔍 Search images...">
</div>
<div id='gallery'></div>
    
<div id="cropModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:9999; padding:20px;">
    <div style="background:#fff; margin:auto; padding:20px; border-radius:20px;">
         <button id="cropApplySelect" class="apply-btn">✓</button>
        <button id="cropCancel" class="crop-close">✕</button>
        <img id="cropImage" style="display:block; margin:auto;">
        <div style="display:flex; gap:10px; margin-top:15px; justify-content:center; flex-wrap:wrap;"></div>
    </div>
    <div class="crop-toolbar">
        <div class="rotation-box"> 
            <button id="zoomReset" class="icon-btn">⛶</button>
            <button id="zoomOut" class="icon-btn">−</button>
            <button id="zoomIn" class="icon-btn"> +</button>
        </div>
        <div class="rotation-box">
            <span class="rotate-label">
                <button id="rotateLeft" class="icon-btn">↺</button>
                <button id="rotateRight" class="icon-btn">↻</button>
            </span>
            <input type="range" id="rotationSlider" min="-180" max="180" value="0" step="1">
            <span id="rotationValue">0°</span>
            <button id="resetCrop" class="icon-btn">🔄️</button>
        </div>
        <div class="rotation-box">
            <button id="cropSave" class="icon-btn">💾</button>
        </div>
    </div>
</div>

<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.85); z-index:99999; padding:15px; align-items:center; justify-content:center;">
    <div style="background:#1e293b; width:100%; max-width:1450px; height:92vh; border-radius:20px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); border:1px solid #334155;">
        <div style="padding:15px 24px; display:flex; justify-content:space-between; align-items:center; background:#111827; border-bottom:1px solid #334155;">
            <h3 style="margin:0; color:#fff; font-size:18px; font-weight:600;">Advanced Image Workspace</h3>
            <button onclick="closeEditModal()" style="background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer; transition:0.2s; line-height:1;">✕</button>
        </div>
        <iframe id="editIframe" style="width:100%; flex:1; border:none; background:#0f172a;"></iframe>
    </div>
</div>


<div id="globalDragOverlay">Drop Image Here</div>

<div id="globalUploadPopup">
    <div id="popupHeader">
        <div class="title-area">
            <span class="drag-handle-icon">☰</span>
            <span>📷 Upload Image</span>
        </div>
        <button class="close-btn" id="popupCloseBtn">✕</button>
    </div>
    <div id="popupBody">
        <div class="paste-zone-info">📋 Paste Here — Press Ctrl + V</div>
        
        <div id="popupSingleView">
            <div id="popupPreviewContainer">
                <img id="popupPreviewImage" src="" alt="Preview">
                <div id="popupMetaDetails">
                    <div class="meta-name" id="metaName">-</div>
                    <div><strong>Type:</strong> <span id="metaType">-</span></div>
                    <div><strong>Resolution:</strong> <span id="metaRes">-</span></div>
                    <div><strong>Size:</strong> <span id="metaSize">-</span></div>
                </div>
            </div>
        </div>
        
        <div id="popupMultipleView" style="display:none;">
            <div id="popupMultipleBadge">0 Images Detected</div>
            <div id="popupMultipleModeOpts">
                <label class="mode-option-label">
                    <input type="radio" name="multiUploadMode" value="crop" checked>
                    <span>○ Crop One By One</span>
                </label>
                <label class="mode-option-label">
                    <input type="radio" name="multiUploadMode" value="original">
                    <span>○ Upload All Original</span>
                </label>
            </div>
        </div>
    </div>
    <div id="popupFooterActions">
        <div id="popupProgressIndicator">
            <span class="material-icons spinner-icon">sync</span>
            <span>Processing...</span>
        </div>
        <button class="popup-cancel-btn" id="popupCancelBtn">Cancel</button>
        <button class="popup-orig-btn" id="popupOrigBtn">Upload Original</button>
        <button class="popup-crop-btn" id="popupCropBtn">Crop & Upload</button>
    </div>
</div>
</body>
</html>
