<script>
let db;
let cropper = null;
let currentCropFile = null;
let currentCropId = null;
let currentCropToken = null; 
let currentRotation = 0;

const objectUrlsMap = new Map();


let incomingQueueFiles = [];


const sampleImagesList = [
    { token: "EX_SAMPLE1", name: "Student Photo .jpg", url: "https://ia600503.us.archive.org/16/items/passport-photo-man/student%20photo.jpg?w=500&auto=format&fit=crop", isSample: true },
    { token: "EX_SAMPLE4", name: "Passport Photo Main.jpg", url: "https://archive.org/download/passport-photo-man/passport-photo-man.jpg?w=500&auto=format&fit=crop", isSample: true },
     { token: "EX_SAMPLE2", name: "Education logo.jpg", url: "https://ia600503.us.archive.org/16/items/passport-photo-man/education-logo.jpg?w=500&auto=format&fit=crop", isSample: true },
    { token: "EX_SAMPLE3", name: "Sample Sign.jpg", url: "https://ia600503.us.archive.org/16/items/passport-photo-man/Sample%20Sign.jpg?w=500&auto=format&fit=crop", isSample: true }
];

const req = indexedDB.open("ImageLibrary", 2);

req.onupgradeneeded = (e) => {
    const database = e.target.result;
    if (database.objectStoreNames.contains("images")) {
        database.deleteObjectStore("images");
    }
    const store = database.createObjectStore("images", {
        keyPath: "id",
        autoIncrement: true
    });
    store.createIndex("token", "token", { unique: true });
};

req.onsuccess = (e) => {
    db = e.target.result;
    
    
    runRetentionCleanupEngine();
    
    load();
    checkUrlParameters();
    initGlobalDragAndPasteHandlers();
    initThreeOptionsInterfaceControls();
};

function checkUrlParameters() {
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const token = urlParams.get('token');

    if (action && token) {
        
        if (token.startsWith("EX_")) {
            const foundSample = sampleImagesList.find(s => s.token === token);
            if (foundSample) {
                if (action === 'edit' || action === 'crop') {
                    openSampleImageInCropperDirectly(foundSample);
                }
            }
            return;
        }

        const tx = db.transaction("images", "readonly");
        const idx = tx.objectStore("images").index("token");
        const query = idx.get(token);

        query.onsuccess = () => {
            const record = query.result;
            if (record) {
                if (action === 'edit') {
                    openImageEditor(record.id, record.token);
                } else if (action === 'crop') {
                    cropExisting(record.id);
                }
            } else {
                console.error("Deep link execution failed.");
            }
        };
    }
}

function handleEditorReturn() {
    const returnUrl = sessionStorage.getItem('passport_return_page');
    if (returnUrl) {
        sessionStorage.removeItem('passport_return_page');
        window.location.replace(returnUrl);
    }
}

function generateUniqueToken() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let token = 'IMG_';
    for (let i = 0; i < 8; i++) {
        token += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return token;
}

function clearExistingObjectUrls() {
    for (const url of objectUrlsMap.values()) {
        
        if (!url.startsWith("http")) {
            URL.revokeObjectURL(url);
        }
    }
    objectUrlsMap.clear();
}

function getImageMetadata(blob) {
    return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve({ width: img.naturalWidth, height: img.naturalHeight });
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            resolve({ width: null, height: null });
        };
        img.src = url;
    });
}

function dataURLtoBlob(dataurl) {
    const arr = dataurl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
    }
    return new Blob([u8arr], { type: mime });
}

document.getElementById("files").addEventListener("change", (e) => {
    save([...e.target.files]);
});

const drop = document.getElementById("drop");

drop.addEventListener("dragover", (e) => {
    e.preventDefault();
    drop.classList.add("dragover");
});

drop.addEventListener("dragleave", () => {
    drop.classList.remove("dragover");
});

drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("dragover");
    const files = [...e.dataTransfer.files];
    save(files);
});

function save(files) {
    const validFiles = files.filter(file => file.type.startsWith("image/"));
    if (validFiles.length === 0) return;

    if (validFiles.length > 1) {
        let processCount = 0;
        validFiles.forEach(async (file) => {
            const meta = await getImageMetadata(file);
            const tx = db.transaction("images", "readwrite");
            
            tx.objectStore("images").add({
                token: generateUniqueToken(),
                name: file.name,
                blob: file,
                created: Date.now(),
                mime: file.type,
                width: meta.width,
                height: meta.height,
                size: file.size
            });

            tx.oncomplete = () => {
                processCount++;
                if (processCount === validFiles.length) {
                    runRetentionCleanupEngine();
                    load();
                }
            };
        });
        return;
    }

    const file = validFiles[0];
    const objectUrl = URL.createObjectURL(file);
    openCropper(objectUrl, file.name, null, null);
}

document.getElementById("cropSave").onclick = async () => {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ imageSmoothingQuality: "high" });
    const dataUrl = canvas.toDataURL("image/png", 1);
    const blob = dataURLtoBlob(dataUrl);
    const meta = await getImageMetadata(blob);

    if (currentCropId && currentCropToken) {
        if (String(currentCropId).startsWith("sample_")) {
            saveNewCroppedEntryDirectly(blob, meta);
        } else {
            updateCroppedImage(currentCropId, currentCropToken, blob, meta);
        }
    } else {
        saveNewCroppedEntryDirectly(blob, meta);
    }
};

function saveNewCroppedEntryDirectly(blob, meta) {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").add({
        token: generateUniqueToken(),
        name: currentCropFile || "cropped_image.png",
        blob: blob,
        created: Date.now(),
        mime: blob.type,
        width: meta.width,
        height: meta.height,
        size: blob.size
    });

    tx.oncomplete = () => {
        closeCropper();
        runRetentionCleanupEngine();
        load();
        checkAndRunNextInQueue();
    };
}

document.getElementById("cropApplySelect").onclick = async () => {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ imageSmoothingQuality: "high" });
    const dataUrl = canvas.toDataURL("image/png", 1);
    const blob = dataURLtoBlob(dataUrl);
    const meta = await getImageMetadata(blob);

    if (currentCropId && currentCropToken) {
        if (String(currentCropId).startsWith("sample_")) {
            saveNewCroppedAndSelectDirectly(blob, meta);
        } else {
            updateCroppedAndSelect(currentCropId, currentCropToken, blob, meta);
        }
    } else {
        saveNewCroppedAndSelectDirectly(blob, meta);
    }
};

function saveNewCroppedAndSelectDirectly(blob, meta) {
    const tx = db.transaction("images", "readwrite");
    const token = generateUniqueToken();
    
    const reqAdd = tx.objectStore("images").add({
        token: token,
        name: currentCropFile || "cropped_image.png",
        blob: blob,
        created: Date.now(),
        mime: blob.type,
        width: meta.width,
        height: meta.height,
        size: blob.size
    });

    reqAdd.onsuccess = (e) => {
        closeCropper();
        runRetentionCleanupEngine();
        load();
        selectImage(e.target.result);
        checkAndRunNextInQueue();
    };
}

document.getElementById("cropCancel").onclick = () => {
    closeCropper();
    checkAndRunNextInQueue();
};

function closeCropper() {
    document.getElementById("cropModal").style.display = "none";
    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
    currentCropFile = null;
    currentCropId = null;
    currentCropToken = null;
    
    if(sessionStorage.getItem('passport_return_page')) {
         handleEditorReturn();
    }
}

function openImageEditor(id, token) {
    
    if (String(id).startsWith("sample_") || token.startsWith("EX_")) {
        const foundSample = sampleImagesList.find(s => s.token === token);
        if (foundSample) openSampleImageInCropperDirectly(foundSample);
        return;
    }
    const url = `/edit/?id=${id}&token=${encodeURIComponent(token)}`;
    const modal = document.getElementById("editModal");
    const iframe = document.getElementById("editIframe");
    
    iframe.src = url;
    modal.style.display = "flex";
}

function closeEditModal() {
    const modal = document.getElementById("editModal");
    const iframe = document.getElementById("editIframe");
    
    iframe.src = "";
    modal.style.display = "none";
    load();
    
    if(sessionStorage.getItem('passport_return_page')) {
         handleEditorReturn();
    }
}

window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "edit_complete") {
        closeEditModal();
        if (event.data.id) {
            selectImage(event.data.id);
        }
    } else if (event.data === "edit_cancel") {
        closeEditModal();
    }
});

function load() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    clearExistingObjectUrls();

    const search = document.getElementById("search").value.toLowerCase();
    const tx = db.transaction("images", "readonly");
    const store = tx.objectStore("images");

    store.openCursor(null, "prev").onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
            const image = cursor.value;
            if (image.name.toLowerCase().includes(search) || image.token.toLowerCase().includes(search)) {
                renderImageCard(image, false);
            }
            cursor.continue();
        } else {
            
            appendPermanentExampleImages(search);
        }
    };
}

function renderImageCard(image, isSample = false) {
    const gallery = document.getElementById("gallery");
    const card = document.createElement("div");
    card.className = "card";

    let blobUrl = "";
    if (isSample) {
        blobUrl = image.url;
    } else {
        const activeBlob = image.editedBlob ? image.editedBlob : image.blob;
        blobUrl = URL.createObjectURL(activeBlob);
        objectUrlsMap.set(image.id, blobUrl);
    }

    const uniqueCardId = isSample ? `sample_${image.token}` : image.id;

    card.innerHTML = `
        <img src="${blobUrl}" draggable="true" id="img-item-${uniqueCardId}" ${isSample ? 'loading="lazy"' : ''} onerror="handleImageLoadFallback(this)">
        <div class="card-body">
            <p style="word-break: break-all; margin: 0 0 5px 0;"><strong>${image.token}</strong> ${isSample ? '<span style="font-size:10px; background:#e2e8f0; padding:2px 6px; border-radius:4px; color:#475569; margin-left:4px;">EXAMPLE</span>' : ''}</p>
            <p style="margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${image.name}</p>
            <div class="actions">
                <button class="primary-btn" id="btn-sel-${uniqueCardId}">Select</button>
                <button class="warning-btn" id="btn-crp-${uniqueCardId}">Crop</button>
                <button class="blue-gradient-btn" id="btn-edt-${uniqueCardId}">✏️ Edit</button>
                <button class="success-btn" id="btn-ren-${uniqueCardId}" ${isSample ? 'disabled' : ''}>Rename</button>
                <button class="danger-btn" id="btn-del-${uniqueCardId}" ${isSample ? 'disabled' : ''}>Delete</button>
            </div>
        </div>
    `;

    gallery.appendChild(card);

    const imgEl = document.getElementById(`img-item-${uniqueCardId}`);
    
    if (isSample) {
        
        imgEl.onclick = () => openSampleImageInCropperDirectly(image);
        imgEl.ondblclick = () => openSampleImageInCropperDirectly(image);
        document.getElementById(`btn-sel-${uniqueCardId}`).onclick = () => openSampleImageInCropperDirectly(image);
        document.getElementById(`btn-crp-${uniqueCardId}`).onclick = () => openSampleImageInCropperDirectly(image);
        document.getElementById(`btn-edt-${uniqueCardId}`).onclick = () => openSampleImageInCropperDirectly(image);
    } else {
        imgEl.onclick = () => selectImage(image.id);
        imgEl.ondblclick = () => openImageEditor(image.id, image.token);
        document.getElementById(`btn-sel-${uniqueCardId}`).onclick = () => selectImage(image.id);
        document.getElementById(`btn-crp-${uniqueCardId}`).onclick = () => cropExisting(image.id);
        document.getElementById(`btn-edt-${uniqueCardId}`).onclick = () => openImageEditor(image.id, image.token);
        document.getElementById(`btn-ren-${uniqueCardId}`).onclick = () => renameImg(image.id);
        document.getElementById(`btn-del-${uniqueCardId}`).onclick = () => deleteImg(image.id);
    }
    
    imgEl.addEventListener("dragstart", (ev) => {
        ev.dataTransfer.setData("text/plain", JSON.stringify({ token: image.token }));
    });
}


function handleImageLoadFallback(imgObj) {
    imgObj.onerror = null;
    imgObj.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23f1f5f9'/><text x='50%' y='50%' font-family='sans-serif' font-size='12' fill='%2394a3b8' dominant-baseline='middle' text-anchor='middle'>Image Missing</text></svg>";
}

function appendPermanentExampleImages(searchQuery) {
    let hasHeaderBeenAdded = false;
    sampleImagesList.forEach(sampleImg => {
        if (sampleImg.name.toLowerCase().includes(searchQuery) || sampleImg.token.toLowerCase().includes(searchQuery)) {
            if (!hasHeaderBeenAdded) {
                const galleryContainer = document.getElementById("gallery");
                const divHeading = document.createElement("div");
                divHeading.className = "section-divider-title";
                divHeading.innerText = "Permanent Library Examples";
                galleryContainer.appendChild(divHeading);
                hasHeaderBeenAdded = true;
            }
            renderImageCard(sampleImg, true);
        }
    });
}

function selectSampleImageDirectly(sampleObj) {
    const payload = { token: sampleObj.token, isSample: true, url: sampleObj.url };
    if (window.self !== window.top) {
        window.parent.postMessage(payload, "*");
        return;
    }
    if (window.opener) {
        window.opener.postMessage(payload, "*");
        window.close();
        return;
    }
    localStorage.setItem("selectedImageToken", sampleObj.token);
    alert("Permanent Example Selected! " + sampleObj.token);
}

function openSampleImageInCropperDirectly(sampleObj) {
    
    const xhr = new XMLHttpRequest();
    xhr.onload = function() {
        const reader = new FileReader();
        reader.onloadend = function() {
            openCropper(reader.result, sampleObj.name, `sample_${sampleObj.token}`, sampleObj.token);
        }
        reader.readAsDataURL(xhr.response);
    };
    xhr.open('GET', sampleObj.url);
    xhr.responseType = 'blob';
    xhr.send();
}

document.getElementById("search").addEventListener("input", load);

function deleteImg(id) {
    if (!confirm("Delete image permanently from Library?")) return;
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").delete(id);
    tx.oncomplete = load;
}

function renameImg(id) {
    const newName = prompt("Enter new name");
    if (!newName) return;

    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    const reqGet = store.get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if(image) {
            image.name = newName;
            store.put(image);
        }
    };
    tx.oncomplete = load;
}

function selectImage(id) {
    const tx = db.transaction("images", "readonly");
    const reqGet = tx.objectStore("images").get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (!image) {
            alert("Image not found.");
            return;
        }

        const messagePayload = { token: image.token };

        if (window.self !== window.top) {
            window.parent.postMessage(messagePayload, "*");
            return;
        }

        if (window.opener) {
            window.opener.postMessage(messagePayload, "*");
            window.close();
            return;
        }

        localStorage.setItem("selectedImageToken", image.token);
        alert("Image Selected! "  + image.token);
    };
}

function openCropper(imageData, fileName, imageId = null, token = null) {
    currentCropFile = fileName;
    currentCropId = imageId;
    currentCropToken = token;

    const modal = document.getElementById("cropModal");
    const image = document.getElementById("cropImage");
    currentRotation = 0;

    document.getElementById("rotationSlider").value = 0;
    document.getElementById("rotationValue").innerText = "0°";
    image.src = imageData;
    modal.style.display = "block";

    image.onload = () => {
        if (cropper) cropper.destroy();
        cropper = new Cropper(image, {
            viewMode: 1,
            autoCropArea: 0.9,
            responsive: true,
            restore: false,
            guides: true,
            center: true,
            background: true,
            highlight: true,
            movable: true,
            zoomable: true,
            scalable: true,
            rotatable: true
        });
    };
}

function cropExisting(id) {
    const tx = db.transaction("images", "readonly");
    const reqGet = tx.objectStore("images").get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (image) {
            const activeBlob = image.editedBlob ? image.editedBlob : image.blob;
            const blobUrl = URL.createObjectURL(activeBlob);
            openCropper(blobUrl, image.name, id, image.token);
        }
    };
}

function updateCroppedImage(id, token, newBlob, meta) {
    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    const reqGet = store.get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (image) {
            image.editedBlob = newBlob; 
            image.mime = newBlob.type;
            image.size = newBlob.size;
            image.width = meta.width;
            image.height = meta.height;
            store.put(image);
        }
    };

    tx.oncomplete = () => {
        closeCropper();
        runRetentionCleanupEngine();
        load();
        handleEditorReturn();
        checkAndRunNextInQueue();
    };
}

function updateCroppedAndSelect(id, token, newBlob, meta) {
    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    const reqGet = store.get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (image) {
            image.editedBlob = newBlob;
            image.mime = newBlob.type;
            image.size = newBlob.size;
            image.width = meta.width;
            image.height = meta.height;
            store.put(image);
        }
    };

    tx.oncomplete = () => {
        closeCropper();
        runRetentionCleanupEngine();
        load();
        if(sessionStorage.getItem('passport_return_page')) {

            selectImage(id);
        }

}

const rotationSlider = document.getElementById("rotationSlider");
rotationSlider.addEventListener("input", function() {
    currentRotation = parseInt(this.value);
    document.getElementById("rotationValue").innerText = currentRotation + "°";
    if (cropper) {
        cropper.rotateTo(currentRotation);
    }
});

document.getElementById("rotateLeft").onclick = () => {
    currentRotation -= 5;
    if (currentRotation < -180) currentRotation = -180;
    cropper.rotateTo(currentRotation);
    rotationSlider.value = currentRotation;
    document.getElementById("rotationValue").innerText = currentRotation + "°";
};

document.getElementById("rotateRight").onclick = () => {
    currentRotation += 5;
    if (currentRotation > 180) currentRotation = 180;
    cropper.rotateTo(currentRotation);
    rotationSlider.value = currentRotation;
    document.getElementById("rotationValue").innerText = currentRotation + "°";
};

document.getElementById("resetCrop").onclick = () => {
    if (cropper) {
        cropper.reset();
        rotationSlider.value = 0;
        document.getElementById("rotationValue").innerText = "0°";
        currentRotation = 0;
    }
};

document.getElementById("zoomIn").onclick = () => {
    if (cropper) cropper.zoom(0.1);
};

document.getElementById("zoomOut").onclick = () => {
    if (cropper) cropper.zoom(-0.1);
};

document.getElementById("zoomReset").onclick = () => {

};






let activePopupObjectUrl = null;
let dragCounter = 0; 

function initGlobalDragAndPasteHandlers() {
    const overlay = document.getElementById("globalDragOverlay");
    
    window.addEventListener("dragenter", (e) => {
        e.preventDefault();
        if (e.dataTransfer.types.includes("text/plain")) {
            const dragDataStr = e.dataTransfer.getData("text/plain");
            if (dragDataStr && dragDataStr.includes("IMG_")) return;
        }
        dragCounter++;
        overlay.style.display = "flex";
        setTimeout(() => overlay.classList.add("active"), 10);
    });

    window.addEventListener("dragover", (e) => {
        e.preventDefault();
    });

    window.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
            dragCounter = 0;
            hideDragOverlay();
        }
    });

    window.addEventListener("drop", (e) => {
        e.preventDefault();
        dragCounter = 0;
        hideDragOverlay();
        
        const files = [...e.dataTransfer.files];
        if (files && files.length > 0) {
            handleIncomingFilesPipeline(files);
        }
    });

    window.addEventListener("paste", (e) => {
        handleClipboardPaste(e);
    });

    document.getElementById("popupCloseBtn").onclick = hideUploadPopup;
    document.getElementById("popupCancelBtn").onclick = hideUploadPopup;
    document.getElementById("popupOrigBtn").onclick = processOriginalUpload;
    document.getElementById("popupCropBtn").onclick = processCropUpload;

    makePopupDraggable(document.getElementById("globalUploadPopup"), document.getElementById("popupHeader"));

    const popupEl = document.getElementById("globalUploadPopup");
    popupEl.addEventListener("dragover", (e) => e.preventDefault());
    popupEl.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const files = [...e.dataTransfer.files];
        if (files && files.length > 0) {
            handleIncomingFilesPipeline(files);
        }
    });

    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            const popup = document.getElementById("globalUploadPopup");
            if (popup.style.display === "flex") {
                hideUploadPopup();
            }
        }
    });
}

function hideDragOverlay() {
    const overlay = document.getElementById("globalDragOverlay");
    overlay.classList.remove("active");
    setTimeout(() => {
        if (!overlay.classList.contains("active")) {
            overlay.style.display = "none";
        }
    }, 300);
}

function handleIncomingFilesPipeline(files) {
    const validFiles = validateImageFiles(files);
    if (validFiles.length === 0) return;

    incomingQueueFiles = validFiles;

    
    if (incomingQueueFiles.length === 1) {
        checkAndRunNextInQueue();
        return;
    }

    showUploadPopup();
    previewIncomingImages();
}

function validateImageFiles(files) {
    const output = [];
    let standardFailureCount = 0;
    
    for (let i = 0; i < files.length; i++) {
        if (files[i].type.startsWith("image/")) {
            output.push(files[i]);
        } else {
            standardFailureCount++;
        }
    }
    if (standardFailureCount > 0 && output.length === 0) {
        alert("This file is not an image.");
    }
    return output;
}

function handleClipboardPaste(e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    const extractedFiles = [];
    
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
            const file = items[i].getAsFile();
            if (file) {
                if (!file.name || file.name === "image.png" || file.name === "blob") {
                    const timestampId = new Date().toISOString().replace(/[:.]/g, "-");
                    Object.defineProperty(file, 'name', {
                        writable: true,
                        value: `Clipboard-${timestampId}.png`
                    });
                }
                extractedFiles.push(file);
            }
        }
    }
    if (extractedFiles.length > 0) {
        handleIncomingFilesPipeline(extractedFiles);
    }
}

function showUploadPopup() {
    const popup = document.getElementById("globalUploadPopup");
    popup.style.display = "flex";
    popup.style.top = "15%";
    popup.style.left = "calc(50% - 325px)";
    
    setTimeout(() => {
        popup.classList.add("visible");
    }, 5);
}

function hideUploadPopup() {
    const popup = document.getElementById("globalUploadPopup");
    popup.classList.remove("visible");
    if (activePopupObjectUrl) {
        URL.revokeObjectURL(activePopupObjectUrl);
        activePopupObjectUrl = null;
    }
    setTimeout(() => {
        if (!popup.classList.contains("visible")) {
            popup.style.display = "none";
            document.getElementById("popupProgressIndicator").style.display = "none";
        }
    }, 300);
}

async function previewIncomingImages() {
    const singleView = document.getElementById("popupSingleView");
    const multiView = document.getElementById("popupMultipleView");
    const cropBtn = document.getElementById("popupCropBtn");
    const origBtn = document.getElementById("popupOrigBtn");

    if (activePopupObjectUrl) {
        URL.revokeObjectURL(activePopupObjectUrl);
        activePopupObjectUrl = null;
    }

    if (incomingQueueFiles.length > 1) {
        singleView.style.display = "none";
        multiView.style.display = "block";
        document.getElementById("popupMultipleBadge").innerText = `${incomingQueueFiles.length} Images Detected`;
        cropBtn.innerText = "Crop One By One";
        origBtn.innerText = "Upload All Original";
    } else {
        multiView.style.display = "none";
        singleView.style.display = "block";
        cropBtn.innerText = "Crop & Upload";
        origBtn.innerText = "Upload Original";

        const targetFile = incomingQueueFiles[0];
        activePopupObjectUrl = URL.createObjectURL(targetFile);
        
        document.getElementById("popupPreviewImage").src = activePopupObjectUrl;
        document.getElementById("metaName").innerText = targetFile.name;
        document.getElementById("metaType").innerText = targetFile.type || "image/unknown";
        document.getElementById("metaSize").innerText = (targetFile.size / 1024).toFixed(1) + " KB";
        
        document.getElementById("metaRes").innerText = "Reading...";
        const dimensions = await getImageMetadata(targetFile);
        if (dimensions.width) {
            document.getElementById("metaRes").innerText = `${dimensions.width} x ${dimensions.height} px`;
        } else {
            document.getElementById("metaRes").innerText = "Unknown resolution";
        }
    }
}

async function processOriginalUpload() {
    const progress = document.getElementById("popupProgressIndicator");
    progress.style.display = "flex";
    
    for (let i = 0; i < incomingQueueFiles.length; i++) {
        const file = incomingQueueFiles[i];
        const dimensions = await getImageMetadata(file);
        
        await new Promise((resolve) => {
            const tx = db.transaction("images", "readwrite");
            tx.objectStore("images").add({
                token: generateUniqueToken(),
                name: file.name,
                blob: file,
                created: Date.now(),
                mime: file.type,
                width: dimensions.width,
                height: dimensions.height,
                size: file.size
            });
            tx.oncomplete = () => resolve();
        });
    }
    
    progress.style.display = "none";
    hideUploadPopup();
    runRetentionCleanupEngine();
    load();
}

function processCropUpload() {
    if (incomingQueueFiles.length > 1) {
        const selectedMode = document.querySelector('input[name="multiUploadMode"]:checked').value;
        if (selectedMode === "original") {
            processOriginalUpload();
            return;
        }
    }
    hideUploadPopup();
    checkAndRunNextInQueue();
}

function checkAndRunNextInQueue() {
    if (incomingQueueFiles.length === 0) return;
    
    const nextFile = incomingQueueFiles.shift();
    const objectUrl = URL.createObjectURL(nextFile);
    openCropper(objectUrl, nextFile.name, null, null);
}

function makePopupDraggable(popupEl, headerEl) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    headerEl.onmousedown = dragMouseDown;

    function dragMouseDown(e) {
        e = e || window.event;
        if (e.target.closest('button')) return;
        
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
    }

    function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        
        popupEl.style.top = (popupEl.offsetTop - pos2) + "px";
        popupEl.style.left = (popupEl.offsetLeft - pos1) + "px";
    }

    function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
    }
}




function initThreeOptionsInterfaceControls() {
    
    const actionCamBtn = document.getElementById("actionCamBtn");
    const cameraFileInput = document.getElementById("cameraFileInput");
    
    actionCamBtn.onclick = () => {
        
        cameraFileInput.click();
    };
    
    cameraFileInput.onchange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
            handleIncomingFilesPipeline([...e.target.files]);
        }
    };

    
    document.getElementById("actionPasteBtn").onclick = async () => {
        try {
            const clipboardItems = await navigator.clipboard.read();
            const extractedFiles = [];
            
            for (const item of clipboardItems) {
                for (const type of item.types) {
                    if (type.startsWith("image/")) {
                        const blob = await item.getType(type);
                        const timestampId = new Date().toISOString().replace(/[:.]/g, "-");
                        const file = new File([blob], `Clipboard-${timestampId}.png`, { type });
                        extractedFiles.push(file);
                    }
                }
            }
            
            if (extractedFiles.length > 0) {
                handleIncomingFilesPipeline(extractedFiles);
            } else {
                
                setupManualClipboardPasteHelperUI();
            }
        } catch (err) {
            
            setupManualClipboardPasteHelperUI();
        }
    };
}

function setupManualClipboardPasteHelperUI() {
    document.getElementById("popupDynamicTitleText").innerText = "📋 Paste Image Ingest Mode";
    document.getElementById("pasteInfoArea").style.display = "block";
    document.getElementById("popupSingleView").style.display = "none";
    document.getElementById("popupMultipleView").style.display = "none";
    document.getElementById("popupCropBtn").style.display = "none";
    document.getElementById("popupOrigBtn").style.display = "none";
    showUploadPopup();
}




function runRetentionCleanupEngine() {
    const retentionSelect = document.getElementById("retentionSelect");
    
    
    const cacheOptionSetting = localStorage.getItem("app_image_retention_rule") || "until_clear";
    retentionSelect.value = cacheOptionSetting;
    
    retentionSelect.onchange = function() {
        const selection = this.value;
        if (selection === "clear_now") {
            if (confirm("Are you sure you want to immediately delete all stored images from IndexedDB completely? This cannot be undone.")) {
                purgeAllStoredIndexedDbRecordsNatively();
            }
            this.value = localStorage.getItem("app_image_retention_rule") || "until_clear";
        } else {
            localStorage.setItem("app_image_retention_rule", selection);
            executeAutoDeletionEvaluation(selection);
        }
    };

    if (cacheOptionSetting !== "until_clear") {
        executeAutoDeletionEvaluation(cacheOptionSetting);
    }
}

function executeAutoDeletionEvaluation(ruleMode) {
    if (!db || ruleMode === "until_clear" || ruleMode === "clear_now") return;
    
    let lifespanMs = 0;
    switch(ruleMode) {
        case "1_hour": lifespanMs = 60 * 60 * 1000; break;
        case "24_hours": lifespanMs = 24 * 60 * 60 * 1000; break;
        case "7_days": lifespanMs = 7 * 24 * 60 * 60 * 1000; break;
        case "30_days": lifespanMs = 30 * 24 * 60 * 60 * 1000; break;
        default: return;
    }
    
    const cutoffTimestamp = Date.now() - lifespanMs;
    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    
    store.openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
            const record = cursor.value;
            
            if (record.created && record.created < cutoffTimestamp) {
                cursor.delete();
            }
            cursor.continue();
        }
    };
    
    tx.oncomplete = () => {
        
        if (document.getElementById("gallery").children.length > 0) {
            load();
        }
    };
}

 window.addEventListener("scroll", () => {
        if (window.scrollY > 60) {
            drop.classList.add("sticky-small");
        } else {
            drop.classList.remove("sticky-small");
        }
    });

function purgeAllStoredIndexedDbRecordsNatively() {
    if (!db) return;
    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    store.clear().onsuccess = () => {
        load();
    };
}
