<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <title>Image Library</title>
    <style>
        :root{
          --primary:#e11d48;
          --bg:#f8fafc;
          --card:#fff;
        }

        body{
          margin:0;
          padding:5px;
          background:var(--bg);
          font-family:Inter,sans-serif;
        }

        .header{
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:20px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            flex-wrap:wrap;
            margin-bottom:25px;
        }

        .title-box h1{
            margin:0;
            font-size:32px;
            color:#111827;
        }

        .title-box p{
            margin-top:6px;
            color:#64748b;
        }

        .search-box{
            flex:1;
            max-width:400px;
        }

        .search-box input{
            width:100%;
            padding:14px 18px;
            border:none;
            border-radius:14px;
            background:#fff;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
            font-size:15px;
        }

        #drop{
            background: linear-gradient(135deg, #fff, #fff5f7);
            border:3px dashed #f43f5e;
            border-radius:24px;
            padding:50px;
            text-align:center;
            transition:.3s;
            box-shadow: 0 15px 35px rgba(0,0,0,.08);
        }

        #drop.dragover{
            background: linear-gradient(135deg, #ffe4e6, #fff1f2);
            transform:scale(1.01);
        }

        .upload-content{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:12px;
        }

        .upload-icon{
            font-size:60px;
        }

        .upload-content h3{
            margin:0;
            color:#111827;
        }

        .upload-content p{
            margin:0;
            color:#64748b;
        }

        .upload-btn{
            margin-top:10px;
            padding: 14px 28px;
            border-radius:14px;
            background: linear-gradient(135deg, #e11d48, #fb7185);
            color:white;
            cursor:pointer;
            font-weight:600;
            transition:.3s;
        }

        .upload-btn:hover{
            transform:translateY(-2px);
        }
        
        #rotationSlider{
            width:250px;
        }
        
        @media(max-width:768px){
            .top-bar{
                flex-direction:column;
                align-items:stretch;
            }

            .search-box{
                max-width:100%;
            }

            #drop{
                padding:30px;
            }
        }

        #gallery{
          display:grid;
          grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
          gap:20px;
          margin-top:25px;
        }

        .card{
          background:white;
          border-radius:20px;
          overflow:hidden;
          box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        .card img{
          width:100%;
          height:220px;
          object-fit:cover;
          cursor:grab;
        }

        .card-body{
          padding:15px;
        }

        .actions{
          display:flex;
          gap:6px;
          margin-top:10px;
          flex-wrap:wrap;
        }

        .actions button{
          flex:1;
          min-width: 68px;
          border:none;
          padding:10px 4px;
          border-radius:10px;
          cursor:pointer;
          display:flex;
          align-items:center;
          justify-content:center;
          gap:2px;
          font-size:12px;
          font-weight:600;
          height: 38px;
        }
        
        .crop-toolbar{
            display:flex;
            align-items:center;
            margin:auto;
            justify-content:center;
            gap:12px;
            flex-wrap:wrap;
            margin-top:20px;
            padding:15px;
            border-radius:18px;
            background:#f8fafc;
        }

        .crop-toolbar button{
            border:none;
            cursor:pointer;
            font-weight:600;
            transition:.25s;
        }

        .crop-toolbar button:hover{
            transform:translateY(-2px);
        }

        .primary-btn{
            color:#fff;
            background:linear-gradient(135deg, #2563eb, #3b82f6);
        }

        .success-btn{
            color:#fff;
            background:linear-gradient(135deg, #16a34a, #22c55e);
        }

        .warning-btn{
            color:#fff;
            background:linear-gradient(135deg, #f59e0b, #fbbf24);
        }

        .danger-btn{
            color:#fff;
            background:linear-gradient(135deg, #dc2626, #ef4444);
        }

        .blue-gradient-btn {
            color:#fff;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
        }

        .icon-btn{
            width:48px;
            height:48px;
            border-radius:50%;
            font-size:22px;
            background:#fff;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }

        .rotation-box{
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 15px;
            border-radius:14px;
            background:#fff;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .rotate-label{
            font-weight:600;
            color:#334155;
        }

        #rotationSlider{
            width:220px;
        }

        #rotationValue{
            min-width:50px;
            text-align:center;
            font-weight:700;
            color:#e11d48;
        }
        
        .crop-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:15px;
        }

        .crop-header h3{
            margin:0;
            font-size:20px;
            color:#111827;
        }

         .apply-btn{
            width:52px;
            height:52px;
            border:none;
            border-radius:50%;
            cursor:pointer;
            position: absolute;
            font-size:20px;
            font-weight:bold;
            z-index: 999;
            color:#fff;
            right: 40px;
            top: 40px;
            background: linear-gradient(135deg, #44ef4d, #00530b);
            transition:.25s;
        }
        .apply-btn:hover{
            transform:scale(1.08);
        }
        .crop-close{
            width:52px;
            height:52px;
            border:none;
            border-radius:50%;
            cursor:pointer;
            position: absolute;
            font-size:20px;
            font-weight:bold;
            z-index: 999;
            color:#fff;
            left: 40px;
            top: 40px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            transition:.25s;
        }

        .crop-close:hover{
            transform:scale(1.08);
        }

        @media(max-width:768px){
            .crop-toolbar{
                display:flex;
                align-items:center;
                justify-content:flex-start;
                gap:12px;
                padding:15px;
                overflow-x:auto;
                overflow-y:hidden;
                flex-wrap:nowrap;
                background:#f8fafc;
                border-radius:18px;
                -webkit-overflow-scrolling:touch;
                scrollbar-width:thin;
            }

            .crop-toolbar > *{
                flex-shrink:0;
            }

            #rotationSlider{
                width:180px;
            }
        }

        #cropModal > div{
            width:100%;
            max-width:880px;
            max-height:90vh;
            overflow:auto;
            padding:15px;
            border-radius:16px;
        }

        #cropImage{
            display:block;
            width:100%;
            max-width:100%;
            max-height:70vh;
            object-fit:contain;
        }

        @media (min-width:769px){
            #cropModal > div{
                max-width:880px;
            }
            #cropImage{
                max-height:55vh;
            }
        }

        @media (max-width:768px){
            .crop-close{
                width:32px;
                height:32px;
                right: 30px;
                top: 20px;
                transition:.25s;
            }
            #cropModal{
                padding:10px !important;
            }
            #cropModal > div{
                width:100%;
                padding:12px;
                border-radius:14px;
            }
            .crop-header h3{
                font-size:18px;
            }
            .crop-toolbar{
                gap:8px;
                padding:10px;
            }
            .crop-toolbar button{
                font-size:14px;
            }
            #cropImage{
                max-height:35vh;
            }
            #rotationSlider{
                width:140px !important;
            }
        }
        
        .cropper-bg{
            background-image:
                linear-gradient(45deg,#f1f5f9 25%,transparent 25%),
                linear-gradient(-45deg,#f1f5f9 25%,transparent 25%),
                linear-gradient(45deg,transparent 75%,#f1f5f9 75%),
                linear-gradient(-45deg,transparent 75%,#f1f5f9 75%);
            background-size:20px 20px;
        }

        @media (max-width:600px){
            #cropModal > div{
                width:90%;
                max-width:90vh;
                max-height:90vh;
                overflow:auto;
                padding:5px;
                border-radius:16px;
                position: absolute;
                left:0;
            }
            #cropImage{
                display:block;
                width:85%;
                max-width:90%;
                max-height:70vh;
                object-fit:contain;
            }
            .crop-toolbar {
                position:relative;
                left:0;
                top:60vh;
                width:90vh;
            }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="title-box">
        <h1>🖼️ Image Library</h1>
        <p>Upload, Crop & Manage Images</p>
    </div>
</div>

<div id="drop">
    <div class="upload-content">
        <div class="upload-icon">☁️</div>
        <h3>Drag & Drop Images</h3>
        <p>Upload JPG, PNG, WEBP Images</p>
        <label class="upload-btn">
            Select Images
            <input type="file" id="files" multiple accept="image/*" hidden>
        </label>
    </div>
</div>
<br>
<div class="search-box">
    <input type="text" id="search" placeholder="🔍 Search images...">
</div>
<div id='gallery'></div>
    
<div id="cropModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:9999; padding:20px;">
    <div style="background:#fff; margin:auto; padding:20px; border-radius:20px;">
         <button id="cropApplySelect" class="apply-btn">✓</button>
        <button id="cropCancel" class="crop-close">✕</button>
        <img id="cropImage" style="display:block; margin:auto;">
        <div style="display:flex; gap:10px; margin-top:15px; justify-content:center; flex-wrap:wrap;"></div>
    </div>
    <div class="crop-toolbar">
        <div class="rotation-box"> 
            <button id="zoomReset" class="icon-btn">⛶</button>
            <button id="zoomOut" class="icon-btn">−</button>
            <button id="zoomIn" class="icon-btn"> +</button>
        </div>
        <div class="rotation-box">
            <span class="rotate-label">
                <button id="rotateLeft" class="icon-btn">↺</button>
                <button id="rotateRight" class="icon-btn">↻</button>
            </span>
            <input type="range" id="rotationSlider" min="-180" max="180" value="0" step="1">
            <span id="rotationValue">0°</span>
            <button id="resetCrop" class="icon-btn">🔄️</button>
        </div>
        <div class="rotation-box">
            <button id="cropSave" class="icon-btn">💾</button>
        </div>
    </div>
</div>

<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.85); z-index:99999; padding:15px; align-items:center; justify-content:center;">
    <div style="background:#1e293b; width:100%; max-width:1450px; height:92vh; border-radius:20px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); border:1px solid #334155;">
        <div style="padding:15px 24px; display:flex; justify-content:space-between; align-items:center; background:#111827; border-bottom:1px solid #334155;">
            <h3 style="margin:0; color:#fff; font-size:18px; font-weight:600;">Advanced Image Workspace</h3>
            <button onclick="closeEditModal()" style="background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer; transition:0.2s; line-height:1;">✕</button>
        </div>
        <iframe id="editIframe" style="width:100%; flex:1; border:none; background:#0f172a;"></iframe>
    </div>
</div>

<script>
let db;
let cropper = null;
let currentCropFile = null;
let currentCropId = null;
let currentCropToken = null; 
let currentRotation = 0;

const objectUrlsMap = new Map();

const req = indexedDB.open("ImageLibrary", 2);

req.onupgradeneeded = (e) => {
    const database = e.target.result;
    if (database.objectStoreNames.contains("images")) {
        database.deleteObjectStore("images");
    }
    const store = database.createObjectStore("images", {
        keyPath: "id",
        autoIncrement: true
    });
    store.createIndex("token", "token", { unique: true });
};

req.onsuccess = (e) => {
    db = e.target.result;
    load();
    checkUrlParameters(); // Initialize automatic deep linking evaluation rule logic
};

function checkUrlParameters() {
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const token = urlParams.get('token');

    if (action && token) {
        const tx = db.transaction("images", "readonly");
        const idx = tx.objectStore("images").index("token");
        const query = idx.get(token);

        query.onsuccess = () => {
            const record = query.result;
            if (record) {
                if (action === 'edit') {
                    openImageEditor(record.id, record.token);
                } else if (action === 'crop') {
                    cropExisting(record.id);
                }
            } else {
                console.error("Deep link execution failed: asset signature target missing.");
            }
        };
    }
}

function handleEditorReturn() {
    const returnUrl = sessionStorage.getItem('passport_return_page');
    if (returnUrl) {
        sessionStorage.removeItem('passport_return_page');
        window.location.replace(returnUrl);
    }
}

function generateUniqueToken() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let token = 'IMG_';
    for (let i = 0; i < 8; i++) {
        token += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return token;
}

function clearExistingObjectUrls() {
    for (const url of objectUrlsMap.values()) {
        URL.revokeObjectURL(url);
    }
    objectUrlsMap.clear();
}

function getImageMetadata(blob) {
    return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve({ width: img.naturalWidth, height: img.naturalHeight });
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            resolve({ width: null, height: null });
        };
        img.src = url;
    });
}

function dataURLtoBlob(dataurl) {
    const arr = dataurl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
    }
    return new Blob([u8arr], { type: mime });
}

document.getElementById("files").addEventListener("change", (e) => {
    save([...e.target.files]);
});

const drop = document.getElementById("drop");

drop.addEventListener("dragover", (e) => {
    e.preventDefault();
    drop.classList.add("dragover");
});

drop.addEventListener("dragleave", () => {
    drop.classList.remove("dragover");
});

drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("dragover");
    const files = [...e.dataTransfer.files];
    save(files);
});

function save(files) {
    const validFiles = files.filter(file => file.type.startsWith("image/"));
    if (validFiles.length === 0) return;

    if (validFiles.length > 1) {
        let processCount = 0;
        validFiles.forEach(async (file) => {
            const meta = await getImageMetadata(file);
            const tx = db.transaction("images", "readwrite");
            
            tx.objectStore("images").add({
                token: generateUniqueToken(),
                name: file.name,
                blob: file,
                created: Date.now(),
                mime: file.type,
                width: meta.width,
                height: meta.height,
                size: file.size
            });

            tx.oncomplete = () => {
                processCount++;
                if (processCount === validFiles.length) {
                    load();
                }
            };
        });
        return;
    }

    const file = validFiles[0];
    const objectUrl = URL.createObjectURL(file);
    openCropper(objectUrl, file.name, null, null);
}

document.getElementById("cropSave").onclick = async () => {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ imageSmoothingQuality: "high" });
    const dataUrl = canvas.toDataURL("image/png", 1);
    const blob = dataURLtoBlob(dataUrl);
    const meta = await getImageMetadata(blob);

    if (currentCropId && currentCropToken) {
        updateCroppedImage(currentCropId, currentCropToken, blob, meta);
    } else {
        const tx = db.transaction("images", "readwrite");
        tx.objectStore("images").add({
            token: generateUniqueToken(),
            name: currentCropFile || "cropped_image.png",
            blob: blob,
            created: Date.now(),
            mime: blob.type,
            width: meta.width,
            height: meta.height,
            size: blob.size
        });

        tx.oncomplete = () => {
            closeCropper();
            load();
        };
    }
};

document.getElementById("cropApplySelect").onclick = async () => {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ imageSmoothingQuality: "high" });
    const dataUrl = canvas.toDataURL("image/png", 1);
    const blob = dataURLtoBlob(dataUrl);
    const meta = await getImageMetadata(blob);

    if (currentCropId && currentCropToken) {
        updateCroppedAndSelect(currentCropId, currentCropToken, blob, meta);
    } else {
        const tx = db.transaction("images", "readwrite");
        const token = generateUniqueToken();
        
        const reqAdd = tx.objectStore("images").add({
            token: token,
            name: currentCropFile || "cropped_image.png",
            blob: blob,
            created: Date.now(),
            mime: blob.type,
            width: meta.width,
            height: meta.height,
            size: blob.size
        });

        reqAdd.onsuccess = (e) => {
            closeCropper();
            load();
            selectImage(e.target.result);
        };
    }
};

document.getElementById("cropCancel").onclick = closeCropper;

function closeCropper() {
    document.getElementById("cropModal").style.display = "none";
    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
    currentCropFile = null;
    currentCropId = null;
    currentCropToken = null;
    
    // Support safe escape fallback patterns without crashing layout routines
    if(sessionStorage.getItem('passport_return_page')) {
         handleEditorReturn();
    }
}

function openImageEditor(id, token) {
    const url = `/edit/?id=${id}&token=${encodeURIComponent(token)}`;
    const modal = document.getElementById("editModal");
    const iframe = document.getElementById("editIframe");
    
    iframe.src = url;
    modal.style.display = "flex";
}

function closeEditModal() {
    const modal = document.getElementById("editModal");
    const iframe = document.getElementById("editIframe");
    
    iframe.src = "";
    modal.style.display = "none";
    load();
    
    if(sessionStorage.getItem('passport_return_page')) {
         handleEditorReturn();
    }
}

window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "edit_complete") {
        closeEditModal();
        if (event.data.id) {
            selectImage(event.data.id);
        }
    } else if (event.data === "edit_cancel") {
        closeEditModal();
    }
});

function load() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    clearExistingObjectUrls();

    const search = document.getElementById("search").value.toLowerCase();
    const tx = db.transaction("images", "readonly");
    const store = tx.objectStore("images");

    store.openCursor(null, "prev").onsuccess = (e) => {
        const cursor = e.target.result;
        if (!cursor) return;

        const image = cursor.value;
        if (image.name.toLowerCase().includes(search) || image.token.toLowerCase().includes(search)) {
            const card = document.createElement("div");
            card.className = "card";

            const activeBlob = image.editedBlob ? image.editedBlob : image.blob;
            const blobUrl = URL.createObjectURL(activeBlob);
            objectUrlsMap.set(image.id, blobUrl);

            card.innerHTML = `
                <img src="${blobUrl}" draggable="true" id="img-item-${image.id}">
                <div class="card-body">
                    <p style="word-break: break-all; margin: 0 0 5px 0;"><strong>${image.token}</strong></p>
                    <p style="margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${image.name}</p>
                    <div class="actions">
                        <button class="primary-btn" id="btn-sel-${image.id}">Select</button>
                        <button class="warning-btn" id="btn-crp-${image.id}">Crop</button>
                        <button class="blue-gradient-btn" id="btn-edt-${image.id}"><span class="material-icons" style="font-size:14px;">edit</span>Edit</button>
                        <button class="success-btn" id="btn-ren-${image.id}">Rename</button>
                        <button class="danger-btn" id="btn-del-${image.id}">Delete</button>
                    </div>
                </div>
            `;

            gallery.appendChild(card);

            const imgEl = document.getElementById(`img-item-${image.id}`);
            imgEl.onclick = () => selectImage(image.id);
            imgEl.ondblclick = () => openImageEditor(image.id, image.token);

            document.getElementById(`btn-sel-${image.id}`).onclick = () => selectImage(image.id);
            document.getElementById(`btn-crp-${image.id}`).onclick = () => cropExisting(image.id);
            document.getElementById(`btn-edt-${image.id}`).onclick = () => openImageEditor(image.id, image.token);
            document.getElementById(`btn-ren-${image.id}`).onclick = () => renameImg(image.id);
            document.getElementById(`btn-del-${image.id}`).onclick = () => deleteImg(image.id);
            
            imgEl.addEventListener("dragstart", (ev) => {
                ev.dataTransfer.setData("text/plain", JSON.stringify({ token: image.token }));
            });
        }
        cursor.continue();
    };
}

document.getElementById("search").addEventListener("input", load);

function deleteImg(id) {
    if (!confirm("Delete image permanently from Library?")) return;
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").delete(id);
    tx.oncomplete = load;
}

function renameImg(id) {
    const newName = prompt("Enter new name");
    if (!newName) return;

    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    const reqGet = store.get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if(image) {
            image.name = newName;
            store.put(image);
        }
    };
    tx.oncomplete = load;
}

function selectImage(id) {
    const tx = db.transaction("images", "readonly");
    const reqGet = tx.objectStore("images").get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (!image) {
            alert("Image not found.");
            return;
        }

        const messagePayload = { token: image.token };

        if (window.self !== window.top) {
            window.parent.postMessage(messagePayload, "*");
            return;
        }

        if (window.opener) {
            window.opener.postMessage(messagePayload, "*");
            window.close();
            return;
        }

        localStorage.setItem("selectedImageToken", image.token);
        alert("Image Selected! "  + image.token);
    };
}

function openCropper(imageData, fileName, imageId = null, token = null) {
    currentCropFile = fileName;
    currentCropId = imageId;
    currentCropToken = token;

    const modal = document.getElementById("cropModal");
    const image = document.getElementById("cropImage");
    currentRotation = 0;

    document.getElementById("rotationSlider").value = 0;
    document.getElementById("rotationValue").innerText = "0°";
    image.src = imageData;
    modal.style.display = "block";

    image.onload = () => {
        if (cropper) cropper.destroy();
        cropper = new Cropper(image, {
            viewMode: 1,
            autoCropArea: 0.9,
            responsive: true,
            restore: false,
            guides: true,
            center: true,
            background: true,
            highlight: true,
            movable: true,
            zoomable: true,
            scalable: true,
            rotatable: true
        });
    };
}

function cropExisting(id) {
    const tx = db.transaction("images", "readonly");
    const reqGet = tx.objectStore("images").get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (image) {
            const activeBlob = image.editedBlob ? image.editedBlob : image.blob;
            const blobUrl = URL.createObjectURL(activeBlob);
            openCropper(blobUrl, image.name, id, image.token);
        }
    };
}

function updateCroppedImage(id, token, newBlob, meta) {
    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    const reqGet = store.get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (image) {
            // Keep identical root profile data intact; persist data inside edited fields
            image.editedBlob = newBlob; 
            image.mime = newBlob.type;
            image.size = newBlob.size;
            image.width = meta.width;
            image.height = meta.height;
            store.put(image);
        }
    };

    tx.oncomplete = () => {
        closeCropper();
        load();
        handleEditorReturn();
    };
}

function updateCroppedAndSelect(id, token, newBlob, meta) {
    const tx = db.transaction("images", "readwrite");
    const store = tx.objectStore("images");
    const reqGet = store.get(id);

    reqGet.onsuccess = () => {
        const image = reqGet.result;
        if (image) {
            image.editedBlob = newBlob;
            image.mime = newBlob.type;
            image.size = newBlob.size;
            image.width = meta.width;
            image.height = meta.height;
            store.put(image);
        }
    };

    tx.oncomplete = () => {
        closeCropper();
        load();
        if(sessionStorage.getItem('passport_return_page')) {
            handleEditorReturn();
        } else {
            selectImage(id);
        }
    };
}

const rotationSlider = document.getElementById("rotationSlider");
rotationSlider.addEventListener("input", function() {
    currentRotation = parseInt(this.value);
    document.getElementById("rotationValue").innerText = currentRotation + "°";
    if (cropper) {
        cropper.rotateTo(currentRotation);
    }
});

document.getElementById("rotateLeft").onclick = () => {
    currentRotation -= 5;
    if (currentRotation < -180) currentRotation = -180;
    cropper.rotateTo(currentRotation);
    rotationSlider.value = currentRotation;
    document.getElementById("rotationValue").innerText = currentRotation + "°";
};

document.getElementById("rotateRight").onclick = () => {
    currentRotation += 5;
    if (currentRotation > 180) currentRotation = 180;
    cropper.rotateTo(currentRotation);
    rotationSlider.value = currentRotation;
    document.getElementById("rotationValue").innerText = currentRotation + "°";
};

document.getElementById("resetCrop").onclick = () => {
    if (cropper) {
        cropper.reset();
        rotationSlider.value = 0;
        document.getElementById("rotationValue").innerText = "0°";
        currentRotation = 0;
    }
};

document.getElementById("zoomIn").onclick = () => {
    if (cropper) cropper.zoom(0.1);
};

document.getElementById("zoomOut").onclick = () => {
    if (cropper) cropper.zoom(-0.1);
};

document.getElementById("zoomReset").onclick = () => {
    if (cropper) cropper.zoomTo(1);
};

window.cropExisting = cropExisting;
window.renameImg = renameImg;
window.deleteImg = deleteImg;
window.selectImage = selectImage;
window.openImageEditor = openImageEditor;
window.closeEditModal = closeEditModal;
</script>
