
<style>
  .page-container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.page-header{
    text-align:center;
    margin-bottom:35px;
}

.page-header h1{
    font-size:36px;
    color:#222;
    margin-bottom:10px;
}

.page-description{
    color:#666;
    font-size:16px;
    max-width:700px;
    margin:auto;
}

.post-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:22px;
}

.post-card{
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.3s;
    overflow:hidden;
}

.post-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.post-link{
    display:block;
    padding:24px;
    text-decoration:none;
}

.post-card h2{
    color:#111;
    font-size:22px;
    margin-bottom:12px;
    line-height:1.4;
}

.post-card p{
    color:#666;
    font-size:15px;
    line-height:1.7;
    margin-bottom:18px;
}

.read-more{
    color:#0d6efd;
    font-weight:600;
    font-size:15px;
}

.post-card:hover .read-more{
    letter-spacing:.5px;
}
</style>
<div class="page-container">

    <div class="page-header">
        <h1>{{ .Title }}</h1>
        {{ with .Content }}
        <div class="page-description">
            {{ . }}
        </div>
        {{ end }}
    </div>

    <div class="post-grid">
        {{ range .Pages }}
        <article class="post-card">
            <a href="{{ .RelPermalink }}" class="post-link">

                <h2>{{ .LinkTitle }}</h2>

                {{ with .Params.description }}
                <p>{{ . }}</p>
                {{ else }}
                <p>{{ .Summary | plainify | truncate 120 }}</p>
                {{ end }}

                <span class="read-more">
                    Read More →
                </span>

            </a>
        </article>
        {{ end }}
    </div>

</div>
