<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Interactive Overlay PDF Studio</title>
    <!-- CDN Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-elevated: #334155;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --success: #10b981;
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #e2e8f0;
            --border-color: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-primary: #4f46e5;
            --accent-hover: #4338ca;
            --accent-light: rgba(79, 70, 229, 0.1);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: 1px solid rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s var(--transition);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            box-shadow: var(--shadow-glass);
        }

        header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-bottom: var(--glass-border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.15rem;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .btn-primary { background: var(--accent-primary); color: #ffffff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: #ffffff; }
        .btn-success { background: var(--success); color: #ffffff; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
        .btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }

        .app-container {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            border-right: var(--glass-border);
            background: var(--bg-surface);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-zone {
            border: 2px dashed var(--accent-primary);
            background: var(--accent-light);
            border-radius: var(--radius-md);
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-zone:hover {
            background: var(--accent-primary);
            color: #fff;
        }

        .upload-zone:hover * { color: #fff !important; }

        .file-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-card {
            background: var(--bg-surface-elevated);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .file-card.active {
            border-color: var(--accent-primary);
            background: var(--accent-light);
        }

        .file-card .handle { cursor: grab; color: var(--text-secondary); }

        .file-thumb {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .file-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .file-info { flex: 1; min-width: 0; }

        .file-name {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-details {
            font-size: 0.725rem;
            color: var(--text-secondary);
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            position: relative;
            overflow: hidden;
        }

        .workspace-toolbar {
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border-bottom: var(--glass-border);
        }

        .preview-container {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .page-stage {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
            transform-origin: center center;
        }

        .page-stage canvas { max-width: 100%; max-height: 100%; display: block; }

        .inspector {
            background: var(--bg-surface);
            border-left: var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs { display: flex; border-bottom: var(--glass-border); }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }

        .tab-btn.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
            background: var(--accent-light);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .tab-content.active { display: flex; }

        .control-group { display: flex; flex-direction: column; gap: 8px; }

        .control-group label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] { flex: 1; accent-color: var(--accent-primary); }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        footer {
            height: 32px;
            background: var(--bg-surface);
            border-top: var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        /* Modal Dialog Styling for Paste Options */
        .paste-modal {
            background: var(--bg-surface);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 360px;
            box-shadow: var(--shadow-glass);
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        .paste-modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Full Screen Drop Overlay Styling */
        .global-drop-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .global-drop-box {
            border: 3px dashed var(--accent-primary);
            background: var(--accent-light);
            padding: 40px 60px;
            border-radius: var(--radius-lg);
            text-align: center;
            color: #fff;
            box-shadow: var(--shadow-glass);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .global-drop-overlay.active {
            display: flex;
        }

        .global-drop-overlay.active .global-drop-box {
            transform: scale(1);
        }

        .progress-box {
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 320px;
            text-align: center;
            box-shadow: var(--shadow-glass);
            border: var(--glass-border);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-surface-elevated);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-primary);
            transition: width 0.1s linear;
        }

        .selection-indicator {
            padding: 8px 12px;
            background: var(--accent-light);
            border: 1px dashed var(--accent-primary);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--accent-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
            .sidebar, .inspector { max-height: 200px; }
        }
    </style>
</head>
<body>

    <header class="glass-panel">
        <div class="logo">
            <i class="fa-solid fa-file-pdf"></i> A4 Interactive Overlay PDF Studio
        </div>
        <div class="header-actions">
            <button class="btn btn-sm" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
            <button class="btn btn-success" onclick="generateMergedPDF(true)"> <i class="fa-solid fa-eye"></i> Print/Preview</button>
<button class="btn btn-primary" onclick="generateMergedPDF(false)"> <i class="fa-solid fa-download"></i> Download PDF</button>
        </div>
    </header>

    <div class="app-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 1.5rem; color: var(--accent-primary);"></i>
                    <div style="font-size: 0.85rem; font-weight: 600; margin-top: 6px;">Drop Files (PDF / Image)</div>
                    <input type="file" id="file-input" multiple accept="application/pdf,image/*" style="display: none;" onchange="handleFileSelect(event)">
                </div>
                <div class="file-toolbar">
                    <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);" id="file-count">0 Pages</span>
                    <button class="btn btn-sm btn-danger" onclick="clearAll()"><i class="fa-solid fa-trash"></i> Clear All</button>
                </div>
            </div>
            <div class="file-list" id="file-list"></div>
        </div>

        <!-- Center Workspace -->
        <div class="workspace">
            <div class="workspace-toolbar">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn btn-sm" onclick="zoomPreview(-0.1)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <span id="zoom-level" style="font-size: 0.8rem;">100%</span>
                    <button class="btn btn-sm" onclick="zoomPreview(0.1)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button class="btn btn-sm" onclick="resetZoom()"><i class="fa-solid fa-expand"></i> Reset</button>
                </div>
                
                <!-- Side-by-Side Action Buttons -->
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-sm btn-primary" onclick="document.getElementById('file-input').click()" title="Add new page layout to list">
                        <i class="fa-solid fa-plus"></i> Add File
                    </button>
                    
                    <button class="btn btn-sm btn-success" onclick="document.getElementById('overlay-file-input').click()" title="Add Image on top of current layout">
                        <i class="fa-solid fa-file-circle-plus"></i> Add Overlay Image
                    </button>
                    <input type="file" id="overlay-file-input" accept="image/*" style="display: none;" onchange="handleAddOverlayImage(event)">
                    
                    <button class="btn btn-sm" onclick="rotateCurrentItem(-90)"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="btn btn-sm" onclick="rotateCurrentItem(90)"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="btn btn-sm btn-danger" onclick="deleteCurrentItem()"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <div class="preview-container" id="preview-container">
                <div class="page-stage" id="page-stage">
                    <canvas id="main-canvas"></canvas>
                </div>
            </div>
        </div>

        <!-- Right Inspector Panel -->
        <div class="inspector">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('adjust')">Effects</button>
                <button class="tab-btn" onclick="switchTab('layout')">Layout</button>
                <button class="tab-btn" onclick="switchTab('crop')">Crop</button>
                <button class="tab-btn" onclick="switchTab('export')">Export Settings</button>
            </div>

            <!-- Tab 1: Visual Effects Engine -->
            <div class="tab-content active" id="tab-adjust">
                <div class="selection-indicator" id="effect-target-label">
                    <span>Target: Full Page Canvas</span>
                    <button class="btn btn-sm" onclick="deselectElement()" style="padding:2px 6px;">Clear Selection</button>
                </div>

                <div class="control-group">
                    <label>Brightness <span id="val-brightness">100%</span></label>
                    <input type="range" id="adj-brightness" min="0" max="200" value="100" oninput="applyFilters()">
                </div>
                <div class="control-group">
                    <label>Contrast <span id="val-contrast">100%</span></label>
                    <input type="range" id="adj-contrast" min="0" max="200" value="100" oninput="applyFilters()">
                </div>
                <div class="control-group">
                    <label>Saturation <span id="val-saturation">100%</span></label>
                    <input type="range" id="adj-saturation" min="0" max="200" value="100" oninput="applyFilters()">
                </div>
                <div class="control-group">
                    <label>Grayscale (B&W) <span id="val-grayscale">0%</span></label>
                    <input type="range" id="adj-grayscale" min="0" max="100" value="0" oninput="applyFilters()">
                </div>
                <div class="control-group">
                    <label>Sepia <span id="val-sepia">0%</span></label>
                    <input type="range" id="adj-sepia" min="0" max="100" value="0" oninput="applyFilters()">
                </div>
                <div class="control-group">
                    <label>Invert Colors <span id="val-invert">0%</span></label>
                    <input type="range" id="adj-invert" min="0" max="100" value="0" oninput="applyFilters()">
                </div>
                <button class="btn btn-sm" onclick="resetFilters()"><i class="fa-solid fa-arrows-rotate"></i> Reset Active Effects</button>
            </div>

            <!-- Tab 2: Page Layout -->
            <div class="tab-content" id="tab-layout">
                <div class="control-group">
                    <label>Target Page Size</label>
                    <select id="layout-size" onchange="updateCanvasDimension(); renderCanvasPreview();">
                        <option value="A4" selected>A4 Standard (210 x 297 mm)</option>
                        <option value="LETTER">US Letter (216 x 279 mm)</option>
                        <option value="LEGAL">US Legal (216 x 356 mm)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Orientation</label>
                    <select id="layout-orientation" onchange="updateCanvasDimension(); renderCanvasPreview();">
                        <option value="portrait" selected>Portrait (Vertical)</option>
                        <option value="landscape">Landscape (Horizontal)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Page Background Color</label>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="color" id="layout-bg-color" value="#ffffff" onchange="renderCanvasPreview();">
                        <span style="font-size:0.8rem;">Canvas Base Fill</span>
                    </div>
                </div>
            </div>

            <!-- Tab 3: Crop -->
            <div class="tab-content" id="tab-crop">
                <div class="control-group">
                    <label>Aspect Ratio</label>
                    <select id="crop-aspect" onchange="changeCropRatio()">
                        <option value="NaN">Free Crop</option>
                        <option value="1">1:1 Square</option>
                        <option value="0.707">A4 Ratio</option>
                        <option value="1.777">16:9 Screen</option>
                    </select>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 12px;">
                    <button class="btn btn-primary btn-sm" style="flex:1;" onclick="startCropping()">Enable Crop</button>
                    <button class="btn btn-success btn-sm" style="flex:1;" onclick="applyCrop()">Apply Crop</button>
                </div>
            </div>

            <!-- Tab 4: Export Settings & File Naming -->
            <div class="tab-content" id="tab-export">
                <div class="control-group">
                    <label>File Naming Mode</label>
                    <select id="naming-mode" onchange="toggleNamingInput()">
                        <option value="first">Use First File Name</option>
                        <option value="custom" selected>Custom Filename</option>
                    </select>
                </div>
                <div class="control-group" id="custom-name-group">
                    <label>Output Filename</label>
                    <input type="text" id="pdf-meta-title" value="Edited_Document">
                </div>
                <div class="control-group">
                    <label>Export Quality</label>
                    <select id="pdf-compression">
                        <option value="0.92">High Quality (100%)</option>
                        <option value="0.75" selected>Balanced (Medium Compression)</option>
                        <option value="0.5">Small File Size</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div id="status-left">Ready</div>
        <div id="status-right">0 Total Pages</div>
    </footer>

    <!-- Paste Selection Dialog Modal -->
    <div class="overlay" id="paste-modal-overlay">
        <div class="paste-modal">
            <i class="fa-solid fa-paste" style="font-size: 2.5rem; color: var(--accent-primary);"></i>
            <div>
                <h3 style="font-size: 1.1rem; margin-bottom: 4px;">Paste Image Choice</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary);">How would you like to place the copied image?</p>
            </div>
            <div class="paste-modal-options">
                <button class="btn btn-primary" onclick="confirmPasteOption('new')">
                    <i class="fa-solid fa-file-circle-plus"></i> Add as New Page
                </button>
                <button class="btn btn-success" id="paste-overlay-btn" onclick="confirmPasteOption('current')">
                    <i class="fa-solid fa-layer-group"></i> Add to Current Page Overlay
                </button>
            </div>
            <button class="btn btn-sm" style="align-self: center;" onclick="closePasteModal()">Cancel</button>
        </div>
    </div>

    <!-- Full Screen Drop Overlay -->
    <div class="global-drop-overlay" id="global-drop-overlay">
        <div class="global-drop-box">
            <i class="fa-solid fa-file-circle-plus" style="font-size: 3.5rem; color: var(--accent-primary);"></i>
            <div style="font-size: 1.25rem; font-weight: 700; margin-top: 12px;">Drop Your PDF or Image Anywhere</div>
            <div style="font-size: 0.85rem; opacity: 0.8; margin-top: 4px;">Files will be added automatically</div>
        </div>
    </div>

    <!-- Progress Overlay -->
    <div class="overlay" id="progress-overlay">
        <div class="progress-box">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-primary);"></i>
            <div id="progress-title" style="font-weight: 600; margin-top: 10px;">Processing...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const PAGE_SIZES = {
            A4: { width: 1240, height: 1754 },
            LETTER: { width: 1275, height: 1650 },
            LEGAL: { width: 1275, height: 2100 }
        };

        let targetCanvasWidth = PAGE_SIZES.A4.width;
        let targetCanvasHeight = PAGE_SIZES.A4.height;

        const state = {
            pages: [], 
            activePageIndex: -1,
            selectedElementIndex: -1, // -1 means Page/Global is selected
            zoom: 1.0,
            cropper: null,
            firstFileName: 'Document'
        };

        let pendingPastedFiles = []; // Temporary holding area for pasted files

        const imageCache = new Map();

        function getCachedImage(src, callback) {
            if (imageCache.has(src)) {
                callback(imageCache.get(src));
            } else {
                const img = new Image();
                img.onload = () => {
                    imageCache.set(src, img);
                    callback(img);
                };
                img.src = src;
            }
        }

        const fileListEl = document.getElementById('file-list');
        new Sortable(fileListEl, {
            animation: 150,
            handle: '.handle',
            onEnd: function (evt) {
                const movedItem = state.pages.splice(evt.oldIndex, 1)[0];
                state.pages.splice(evt.newIndex, 0, movedItem);
                renderPageList();
            }
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').className = newTheme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        function toggleNamingInput() {
            const mode = document.getElementById('naming-mode').value;
            const customGroup = document.getElementById('custom-name-group');
            customGroup.style.display = mode === 'first' ? 'none' : 'flex';
        }

        function updateCanvasDimension() {
            const sizeKey = document.getElementById('layout-size').value;
            const orientation = document.getElementById('layout-orientation').value;
            let dims = PAGE_SIZES[sizeKey] || PAGE_SIZES.A4;

            if (orientation === 'landscape') {
                targetCanvasWidth = dims.height;
                targetCanvasHeight = dims.width;
            } else {
                targetCanvasWidth = dims.width;
                targetCanvasHeight = dims.height;
            }
        }

        async function processFilesArray(files, forceOverlay = false) {
            if (!files || !files.length) return;

            if (state.pages.length === 0 && files.length > 0 && !forceOverlay) {
                state.firstFileName = files[0].name ? files[0].name.replace(/\.[^/.]+$/, "") : 'Pasted_Image';
            }

            showProgress("Processing Image...", 5);
            updateCanvasDimension();

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    if (!forceOverlay && ((file.type && file.type.includes('pdf')) || (file.name && file.name.toLowerCase().endsWith('.pdf')))) {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        
                        for (let p = 1; p <= pdf.numPages; p++) {
                            const page = await pdf.getPage(p);
                            const viewport = page.getViewport({ scale: 2.0 });
                            
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;

                            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                            
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                            state.pages.push(createNewPageObject(`${file.name || 'Document'} (Pg ${p})`, dataUrl, viewport.width, viewport.height));
                        }
                    } else if (file.type && file.type.includes('image')) {
                        const imgUrl = URL.createObjectURL(file);
                        const img = new Image();
                        await new Promise(r => { img.onload = r; img.src = imgUrl; });
                        
                        if (forceOverlay && state.activePageIndex !== -1) {
                            // Add directly as overlay element
                            const pg = state.pages[state.activePageIndex];
                            const w = Math.min(400, img.width);
                            const h = (img.height / img.width) * w;
                            const newElem = {
                                id: 'el_' + Date.now(),
                                type: 'overlay',
                                src: imgUrl,
                                x: (targetCanvasWidth - w) / 2,
                                y: (targetCanvasHeight - h) / 2,
                                width: w, height: h,
                                filters: { brightness: 100, contrast: 100, saturation: 100, grayscale: 0, sepia: 0, invert: 0 }
                            };
                            pg.elements.push(newElem);
                            state.selectedElementIndex = pg.elements.length - 1;
                            updateEffectTargetUI();
                        } else {
                            // Add as new layout page
                            state.pages.push(createNewPageObject(file.name || 'Pasted Image', imgUrl, img.width, img.height));
                        }
                    }
                    updateProgress(Math.round(((i + 1) / files.length) * 100));
                }

                renderPageList();
                if (state.pages.length > 0 && state.activePageIndex === -1) {
                    setActivePage(0);
                } else if (forceOverlay) {
                    renderCanvasPreview();
                }
            } catch (err) {
                console.error("Error loading files:", err);
                alert("Error loading file: " + err.message);
            } finally {
                hideProgress();
            }
        }

        async function handleFileSelect(e) {
            const rawFiles = e.target.files;
            if (!rawFiles || !rawFiles.length) return;
            await processFilesArray(Array.from(rawFiles));
            e.target.value = '';
        }

        function createNewPageObject(name, imgUrl, origW, origH) {
            const ratio = Math.min((targetCanvasWidth - 80) / origW, (targetCanvasHeight - 80) / origH);
            const w = origW * ratio;
            const h = origH * ratio;
            const x = (targetCanvasWidth - w) / 2;
            const y = (targetCanvasHeight - h) / 2;

            return {
                id: 'pg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name: name,
                rotation: 0,
                globalFilters: { brightness: 100, contrast: 100, saturation: 100, grayscale: 0, sepia: 0, invert: 0 },
                elements: [
                    {
                        id: 'el_' + Date.now(),
                        type: 'base',
                        src: imgUrl,
                        x: x, y: y, width: w, height: h,
                        filters: { brightness: 100, contrast: 100, saturation: 100, grayscale: 0, sepia: 0, invert: 0 }
                    }
                ]
            };
        }

        function handleAddOverlayImage(e) {
            if (state.activePageIndex === -1) {
                alert("Please select or add a page layout first.");
                return;
            }
            const file = e.target.files[0];
            if (!file) return;

            processFilesArray([file], true);
            e.target.value = '';
        }

        function renderPageList() {
            fileListEl.innerHTML = '';
            state.pages.forEach((pg, index) => {
                const card = document.createElement('div');
                card.className = `file-card ${index === state.activePageIndex ? 'active' : ''}`;
                card.onclick = () => setActivePage(index);

                const thumbSrc = pg.elements[0] ? pg.elements[0].src : '';

                card.innerHTML = `
                    <i class="fa-solid fa-grip-vertical handle"></i>
                    <div class="file-thumb"><img src="${thumbSrc}"></div>
                    <div class="file-info">
                        <div class="file-name">${pg.name}</div>
                        <div class="file-details">Page ${index + 1} (${pg.elements.length} Items)</div>
                    </div>
                    <button class="btn btn-sm btn-icon" onclick="event.stopPropagation(); deletePage(${index})"><i class="fa-solid fa-xmark"></i></button>
                `;
                fileListEl.appendChild(card);
            });
            document.getElementById('file-count').innerText = `${state.pages.length} Pages`;
            document.getElementById('status-right').innerText = `${state.pages.length} Total Pages`;
        }

        function setActivePage(index) {
            if (index < 0 || index >= state.pages.length) return;
            state.activePageIndex = index;
            state.selectedElementIndex = -1; // Default to Full Page Selection
            renderPageList();
            updateEffectTargetUI();
            renderCanvasPreview();
        }

        function updateEffectTargetUI() {
            if (state.activePageIndex === -1) return;
            const pg = state.pages[state.activePageIndex];
            const labelEl = document.getElementById('effect-target-label');

            let activeFilters;
            if (state.selectedElementIndex >= 0 && pg.elements[state.selectedElementIndex]) {
                activeFilters = pg.elements[state.selectedElementIndex].filters;
                labelEl.querySelector('span').innerText = `Target: Selected Image #${state.selectedElementIndex + 1}`;
            } else {
                activeFilters = pg.globalFilters;
                labelEl.querySelector('span').innerText = `Target: Full Page Canvas`;
            }

            document.getElementById('adj-brightness').value = activeFilters.brightness;
            document.getElementById('adj-contrast').value = activeFilters.contrast;
            document.getElementById('adj-saturation').value = activeFilters.saturation;
            document.getElementById('adj-grayscale').value = activeFilters.grayscale;
            document.getElementById('adj-sepia').value = activeFilters.sepia;
            document.getElementById('adj-invert').value = activeFilters.invert;

            document.getElementById('val-brightness').innerText = activeFilters.brightness + '%';
            document.getElementById('val-contrast').innerText = activeFilters.contrast + '%';
            document.getElementById('val-saturation').innerText = activeFilters.saturation + '%';
        }

        function deselectElement() {
            state.selectedElementIndex = -1;
            updateEffectTargetUI();
            renderCanvasPreview();
        }

        // Render Canvas with Layers + Handles
        function renderCanvasPreview() {
            if (state.activePageIndex === -1) return;
            updateCanvasDimension();

            const pg = state.pages[state.activePageIndex];
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = targetCanvasWidth;
            canvas.height = targetCanvasHeight;

            const bgColor = document.getElementById('layout-bg-color').value;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply Global Filter to the entire Canvas Page
            ctx.save();
            ctx.filter = `brightness(${pg.globalFilters.brightness}%) contrast(${pg.globalFilters.contrast}%) saturate(${pg.globalFilters.saturation}%) grayscale(${pg.globalFilters.grayscale}%) sepia(${pg.globalFilters.sepia}%) invert(${pg.globalFilters.invert}%)`;

            pg.elements.forEach((elem, idx) => {
                getCachedImage(elem.src, (img) => {
                    ctx.save();
                    // Apply individual element filter
                    ctx.filter = `brightness(${elem.filters.brightness}%) contrast(${elem.filters.contrast}%) saturate(${elem.filters.saturation}%) grayscale(${elem.filters.grayscale}%) sepia(${elem.filters.sepia}%) invert(${elem.filters.invert}%)`;
                    ctx.drawImage(img, elem.x, elem.y, elem.width, elem.height);
                    ctx.restore();

                    // Draw Bounding Box & Handles if selected
                    if (idx === state.selectedElementIndex) {
                        drawTransformBoundingBox(ctx, elem);
                    }
                });
            });

            ctx.restore();

            const stage = document.getElementById('page-stage');
            stage.style.transform = `scale(${state.zoom}) rotate(${pg.rotation}deg)`;
        }

        function drawTransformBoundingBox(ctx, elem) {
            ctx.save();
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 8]);
            ctx.strokeRect(elem.x, elem.y, elem.width, elem.height);

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);

            const handleSize = 18;
            const corners = [
                { id: 'tl', x: elem.x, y: elem.y },
                { id: 'tr', x: elem.x + elem.width, y: elem.y },
                { id: 'bl', x: elem.x, y: elem.y + elem.height },
                { id: 'br', x: elem.x + elem.width, y: elem.y + elem.height }
            ];

            corners.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, handleSize / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            ctx.restore();
        }

        // Mouse Engine: Dragging, Resizing & Dynamic Cursor Logic
        let isDragging = false;
        let isResizing = false;
        let activeHandle = null;
        let dragStartX = 0, dragStartY = 0;

        const mainCanvas = document.getElementById('main-canvas');

        function getCanvasCoordinates(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const scaleX = mainCanvas.width / rect.width;
            const scaleY = mainCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function getHitHandle(pos, elem) {
            const handleRadius = 24;
            const corners = {
                tl: { x: elem.x, y: elem.y },
                tr: { x: elem.x + elem.width, y: elem.y },
                bl: { x: elem.x, y: elem.y + elem.height },
                br: { x: elem.x + elem.width, y: elem.y + elem.height }
            };

            for (let key in corners) {
                if (Math.hypot(pos.x - corners[key].x, pos.y - corners[key].y) <= handleRadius) {
                    return key;
                }
            }
            return null;
        }

        // Dynamic Cursor Handler
        mainCanvas.addEventListener('mousemove', (e) => {
            if (state.activePageIndex === -1) return;
            const pos = getCanvasCoordinates(e);
            const pg = state.pages[state.activePageIndex];

            let cursorStyle = 'default';

            if (isDragging) {
                cursorStyle = 'grabbing';
            } else if (isResizing) {
                cursorStyle = (activeHandle === 'tl' || activeHandle === 'br') ? 'nwse-resize' : 'nesw-resize';
            } else {
                if (state.selectedElementIndex >= 0 && pg.elements[state.selectedElementIndex]) {
                    const elem = pg.elements[state.selectedElementIndex];
                    const handle = getHitHandle(pos, elem);
                    if (handle) {
                        cursorStyle = (handle === 'tl' || handle === 'br') ? 'nwse-resize' : 'nesw-resize';
                    } else if (pos.x >= elem.x && pos.x <= elem.x + elem.width &&
                               pos.y >= elem.y && pos.y <= elem.y + elem.height) {
                        cursorStyle = 'grab';
                    }
                }

                if (cursorStyle === 'default') {
                    for (let i = pg.elements.length - 1; i >= 0; i--) {
                        const elem = pg.elements[i];
                        if (pos.x >= elem.x && pos.x <= elem.x + elem.width &&
                            pos.y >= elem.y && pos.y <= elem.y + elem.height) {
                            cursorStyle = 'grab';
                            break;
                        }
                    }
                }
            }

            mainCanvas.style.cursor = cursorStyle;

            if (isDragging && state.selectedElementIndex >= 0) {
                const elem = pg.elements[state.selectedElementIndex];
                elem.x = pos.x - dragStartX;
                elem.y = pos.y - dragStartY;
                renderCanvasPreview();
            } else if (isResizing && state.selectedElementIndex >= 0) {
                const elem = pg.elements[state.selectedElementIndex];
                const dx = pos.x - dragStartX;
                const dy = pos.y - dragStartY;

                if (activeHandle === 'br') {
                    elem.width = Math.max(40, elem.width + dx);
                    elem.height = Math.max(40, elem.height + dy);
                } else if (activeHandle === 'tl') {
                    const newW = Math.max(40, elem.width - dx);
                    const newH = Math.max(40, elem.height - dy);
                    elem.x += (elem.width - newW);
                    elem.y += (elem.height - newH);
                    elem.width = newW;
                    elem.height = newH;
                } else if (activeHandle === 'tr') {
                    elem.width = Math.max(40, elem.width + dx);
                    const newH = Math.max(40, elem.height - dy);
                    elem.y += (elem.height - newH);
                    elem.height = newH;
                } else if (activeHandle === 'bl') {
                    const newW = Math.max(40, elem.width - dx);
                    elem.x += (elem.width - newW);
                    elem.width = newW;
                    elem.height = Math.max(40, elem.height + dy);
                }

                dragStartX = pos.x;
                dragStartY = pos.y;
                renderCanvasPreview();
            }
        });

        mainCanvas.addEventListener('mousedown', (e) => {
            if (state.activePageIndex === -1) return;
            const pos = getCanvasCoordinates(e);
            const pg = state.pages[state.activePageIndex];

            if (state.selectedElementIndex >= 0) {
                const elem = pg.elements[state.selectedElementIndex];
                const handle = getHitHandle(pos, elem);
                if (handle) {
                    isResizing = true;
                    activeHandle = handle;
                    dragStartX = pos.x;
                    dragStartY = pos.y;
                    return;
                }
            }

            let foundIndex = -1;
            for (let i = pg.elements.length - 1; i >= 0; i--) {
                const elem = pg.elements[i];
                if (pos.x >= elem.x && pos.x <= elem.x + elem.width &&
                    pos.y >= elem.y && pos.y <= elem.y + elem.height) {
                    foundIndex = i;
                    break;
                }
            }

            state.selectedElementIndex = foundIndex;
            updateEffectTargetUI();

            if (foundIndex >= 0) {
                isDragging = true;
                const elem = pg.elements[foundIndex];
                dragStartX = pos.x - elem.x;
                dragStartY = pos.y - elem.y;
                mainCanvas.style.cursor = 'grabbing';
            }

            renderCanvasPreview();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
            activeHandle = null;
        });

        function applyFilters() {
            if (state.activePageIndex === -1) return;
            const pg = state.pages[state.activePageIndex];

            let activeFilters;
            if (state.selectedElementIndex >= 0 && pg.elements[state.selectedElementIndex]) {
                activeFilters = pg.elements[state.selectedElementIndex].filters;
            } else {
                activeFilters = pg.globalFilters;
            }

            activeFilters.brightness = document.getElementById('adj-brightness').value;
            activeFilters.contrast = document.getElementById('adj-contrast').value;
            activeFilters.saturation = document.getElementById('adj-saturation').value;
            activeFilters.grayscale = document.getElementById('adj-grayscale').value;
            activeFilters.sepia = document.getElementById('adj-sepia').value;
            activeFilters.invert = document.getElementById('adj-invert').value;

            document.getElementById('val-brightness').innerText = activeFilters.brightness + '%';
            document.getElementById('val-contrast').innerText = activeFilters.contrast + '%';
            document.getElementById('val-saturation').innerText = activeFilters.saturation + '%';

            renderCanvasPreview();
        }

        function resetFilters() {
            document.getElementById('adj-brightness').value = 100;
            document.getElementById('adj-contrast').value = 100;
            document.getElementById('adj-saturation').value = 100;
            document.getElementById('adj-grayscale').value = 0;
            document.getElementById('adj-sepia').value = 0;
            document.getElementById('adj-invert').value = 0;
            applyFilters();
        }

        function startCropping() {
            const canvas = document.getElementById('main-canvas');
            if (state.cropper) state.cropper.destroy();
            state.cropper = new Cropper(canvas, { aspectRatio: NaN, viewMode: 1 });
        }

        function changeCropRatio() {
            const ratio = parseFloat(document.getElementById('crop-aspect').value);
            if (state.cropper) state.cropper.setAspectRatio(ratio);
        }

        function applyCrop() {
            if (!state.cropper || state.activePageIndex === -1) return;
            const croppedCanvas = state.cropper.getCroppedCanvas();
            const croppedUrl = croppedCanvas.toDataURL();
            
            const pg = state.pages[state.activePageIndex];
            if (state.selectedElementIndex >= 0 && pg.elements[state.selectedElementIndex]) {
                pg.elements[state.selectedElementIndex].src = croppedUrl;
            } else if (pg.elements[0]) {
                pg.elements[0].src = croppedUrl;
            }
            
            state.cropper.destroy();
            state.cropper = null;
            renderPageList();
            renderCanvasPreview();
        }

        function rotateCurrentItem(deg) {
            if (state.activePageIndex === -1) return;
            const pg = state.pages[state.activePageIndex];
            pg.rotation = (pg.rotation + deg) % 360;
            renderCanvasPreview();
        }

        function deletePage(index) {
            state.pages.splice(index, 1);
            if (state.pages.length === 0) {
                state.activePageIndex = -1;
                state.selectedElementIndex = -1;
                state.firstFileName = 'Document';
                const canvas = document.getElementById('main-canvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            } else {
                setActivePage(Math.min(index, state.pages.length - 1));
            }
            renderPageList();
        }

        function deleteCurrentItem() {
            if (state.activePageIndex === -1) return;
            const pg = state.pages[state.activePageIndex];

            if (state.selectedElementIndex >= 0 && pg.elements.length > 1) {
                pg.elements.splice(state.selectedElementIndex, 1);
                state.selectedElementIndex = -1;
                updateEffectTargetUI();
                renderCanvasPreview();
            } else {
                deletePage(state.activePageIndex);
            }
        }

        function clearAll() {
            state.pages = [];
            state.activePageIndex = -1;
            state.selectedElementIndex = -1;
            state.firstFileName = 'Document';
            imageCache.clear();
            renderPageList();
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function zoomPreview(val) {
            state.zoom = Math.max(0.2, Math.min(4.0, state.zoom + val));
            renderCanvasPreview();
            document.getElementById('zoom-level').innerText = Math.round(state.zoom * 100) + '%';
        }

        function resetZoom() {
            state.zoom = 1.0;
            renderCanvasPreview();
            document.getElementById('zoom-level').innerText = '100%';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        async function generateMergedPDF(openInBrowser = false) {
            if (!state.pages.length) {
                alert("Please add at least one page or file.");
                return;
            }

            showProgress("Building Interactive A4 PDF...", 0);
            updateCanvasDimension();

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();
                
                const namingMode = document.getElementById('naming-mode').value;
                let exportFileName = 'Edited_Document';
                if (namingMode === 'first') {
                    exportFileName = state.firstFileName || 'Document';
                } else {
                    exportFileName = document.getElementById('pdf-meta-title').value.trim() || 'Edited_Document';
                }

                pdfDoc.setTitle(exportFileName);

                const total = state.pages.length;
                const quality = parseFloat(document.getElementById('pdf-compression').value);

                for (let i = 0; i < total; i++) {
                    const pg = state.pages[i];
                    updateProgress(Math.round(((i + 1) / total) * 100));

                    const tempCanvas = document.createElement('canvas');
                    const ctx = tempCanvas.getContext('2d');

                    tempCanvas.width = targetCanvasWidth;
                    tempCanvas.height = targetCanvasHeight;

                    const bgColor = document.getElementById('layout-bg-color').value;
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                    ctx.save();
                    ctx.filter = `brightness(${pg.globalFilters.brightness}%) contrast(${pg.globalFilters.contrast}%) saturate(${pg.globalFilters.saturation}%) grayscale(${pg.globalFilters.grayscale}%) sepia(${pg.globalFilters.sepia}%) invert(${pg.globalFilters.invert}%)`;

                    for (let j = 0; j < pg.elements.length; j++) {
                        const elem = pg.elements[j];
                        const img = new Image();
                        await new Promise(resolve => {
                            img.onload = resolve;
                            img.src = elem.src;
                        });

                        ctx.save();
                        ctx.filter = `brightness(${elem.filters.brightness}%) contrast(${elem.filters.contrast}%) saturate(${elem.filters.saturation}%) grayscale(${elem.filters.grayscale}%) sepia(${elem.filters.sepia}%) invert(${elem.filters.invert}%)`;
                        ctx.drawImage(img, elem.x, elem.y, elem.width, elem.height);
                        ctx.restore();
                    }

                    ctx.restore();

                    const finalDataUrl = tempCanvas.toDataURL('image/jpeg', quality);
                    const embeddedImg = await pdfDoc.embedJpg(finalDataUrl);

                    const page = pdfDoc.addPage([embeddedImg.width, embeddedImg.height]);
                    page.setRotation(PDFLib.degrees(pg.rotation || 0));
                    page.drawImage(embeddedImg, {
                        x: 0,
                        y: 0,
                        width: embeddedImg.width,
                        height: embeddedImg.height,
                    });
                }

                const pdfBytes = await pdfDoc.save();
const blob = new Blob([pdfBytes], {
    type: "application/pdf"
});

const blobUrl = URL.createObjectURL(blob);

if (openInBrowser) {

    // Open PDF in new tab
    window.open(blobUrl, "_blank");

} else {

    // Download PDF
    const link = document.createElement("a");
    link.href = blobUrl;
    link.download = `${exportFileName}.pdf`;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
    }, 5000);
}
            } catch (err) {
                console.error("Export Error:", err);
                alert("Failed to export PDF: " + err.message);
            } finally {
                hideProgress();
            }
        }

        function showProgress(title, fill) {
            document.getElementById('progress-overlay').style.display = 'flex';
            document.getElementById('progress-title').innerText = title;
            document.getElementById('progress-fill').style.width = fill + '%';
        }

        function updateProgress(fill) {
            document.getElementById('progress-fill').style.width = fill + '%';
        }

        function hideProgress() {
            document.getElementById('progress-overlay').style.display = 'none';
        }

        /* PASTE SELECTION MODAL LOGIC */
        const pasteModalOverlay = document.getElementById('paste-modal-overlay');
        const pasteOverlayBtn = document.getElementById('paste-overlay-btn');

        function openPasteModal(files) {
            pendingPastedFiles = files;
            // Disable 'Overlay' option if no active page exists
            if (state.activePageIndex === -1) {
                pasteOverlayBtn.style.display = 'none';
            } else {
                pasteOverlayBtn.style.display = 'inline-flex';
            }
            pasteModalOverlay.style.display = 'flex';
        }

        function closePasteModal() {
            pendingPastedFiles = [];
            pasteModalOverlay.style.display = 'none';
        }

        function confirmPasteOption(option) {
            const files = [...pendingPastedFiles];
            closePasteModal();
            if (option === 'new') {
                processFilesArray(files, false);
            } else if (option === 'current') {
                processFilesArray(files, true);
            }
        }

        /* GLOBAL FULL SCREEN DRAG-AND-DROP OVERLAY */
        const globalDropOverlay = document.getElementById('global-drop-overlay');
        let dragTimer = null;

        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            globalDropOverlay.classList.add('active');
            clearTimeout(dragTimer);
        });

        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragTimer = setTimeout(() => {
                globalDropOverlay.classList.remove('active');
            }, 100);
        });

        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            globalDropOverlay.classList.remove('active');
            
            const files = e.dataTransfer && e.dataTransfer.files;
            if (files && files.length > 0) {
                await processFilesArray(Array.from(files));
            }
        });

        /* CLIPBOARD PASTE (CTRL+V) WITH OPTION DIALOG */
        window.addEventListener('paste', async (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const filesToProcess = [];
            for (let item of items) {
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    if (blob) filesToProcess.push(blob);
                }
            }
            if (filesToProcess.length > 0) {
                // If there are no existing pages, directly add as a new page
                if (state.pages.length === 0) {
                    await processFilesArray(filesToProcess, false);
                } else {
                    // Open choice modal
                    openPasteModal(filesToProcess);
                }
            }
        });

        /* MOUSE WHEEL ZOOMING IN WORKSPACE AREA */
        const previewContainer = document.getElementById('preview-container');
        previewContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.08 : -0.08;
            zoomPreview(delta);
        }, { passive: false });
    </script>
</body>
</html>
