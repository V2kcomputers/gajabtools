    background: #dc3545;

  /* ===========================
   Template Switcher
=========================== */

}

.template-card{

    overflow:hidden;
    background:#fff;

.template-card:hover{

.template-card input{

.template-card img{

.template-card span{

<script>
let cardCounter = 0;
let studentsData = [];
let editingStudentId = null;
let currentUploadField = "";

const activeObjectURLs = new Set();

// Default hardcoded image paths configuration
const defaultSchoolLogo = "/svg/school.svg";
const defaultSignature = "/svg/signature.svg";
const defaultStudentPhoto = "/svg/student-person-3.svg";

function openImageDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("ImageLibrary", 2);
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains("images")) {
                const store = database.createObjectStore("images", { keyPath: "id", autoIncrement: true });
                store.createIndex("token", "token", { unique: true });
            }
        };
    });
}

async function getImageByToken(token) {
    if (!token) return null;
    try {
        const db = await openImageDB();
        const tx = db.transaction("images", "readonly");
        const index = tx.objectStore("images").index("token");
        return new Promise(resolve => {
            index.get(token).onsuccess = (e) => resolve(e.target.result || null);
        });
    } catch (err) {
        console.error("IndexedDB Error:", err);
        return null;
    }
}

// Fixed asset lookup wrapping target paths dynamically upon token evaluation missing
async function getObjectURL(token, fallbackPath) {
    if (!token) return fallbackPath;
    const imageRecord = await getImageByToken(token);
    if (imageRecord && imageRecord.blob) {
        const url = URL.createObjectURL(imageRecord.blob);
        activeObjectURLs.add(url);
        return url;
    }
    return fallbackPath;
}

function revokeUnusedURLs() {
    activeObjectURLs.forEach(url => URL.revokeObjectURL(url));
    activeObjectURLs.clear();
}

async function setPreview(field, token) {
    const hiddenInput = document.getElementById(field);
    const previewContainer = document.getElementById(field + "Preview");
    if (!hiddenInput || !previewContainer) return;
    
    hiddenInput.value = token || "";
    
    // Choose appropriate fallback rendering type visually inside dashboard UI pane
    let fallback = defaultStudentPhoto;
    if (field === "schoolLogo") fallback = defaultSchoolLogo;
    if (field === "principalSignature") fallback = defaultSignature;

    const url = await getObjectURL(token, fallback);
    previewContainer.innerHTML = `<img src="${url}" width="120" style="margin-top:10px; border-radius:4px; max-height:100px; object-fit:contain;">`;
    
    // If user changes school assets inside open fields, cascade update directly to profile storage layer
    if (field === "schoolLogo" || field === "principalSignature") {
        autoSaveSchoolProfileSilent();
    }
}

function openUploader(field) {
    currentUploadField = field;
    document.getElementById("uploadFrame").src = "/upload/";
    document.getElementById("uploadModal").style.display = "flex";
}

function closeUploader() {
    document.getElementById("uploadModal").style.display = "none";
    document.getElementById("uploadFrame").src = "";
}

window.addEventListener("message", async function(e) {
    if (!e.data || !e.data.token) return;
    if (currentUploadField) {
        await setPreview(currentUploadField, e.data.token);
    }
    closeUploader();
});

// Automated instantiation sequences mapping
window.addEventListener("DOMContentLoaded", async () => {
  window.addEventListener("DOMContentLoaded",()=>{

const params=new URLSearchParams(location.search);

const format=params.get("format");

if(!format) return;

const radio=document.querySelector(
`input[data-format="${format}"]`
);

if(radio){

radio.checked=true;

selectedTemplate=radio.value;

}

});
    // Restore School Profile configuration block layout parameters
    const storedProfile = localStorage.getItem("school-profile");
    if (storedProfile) {
        try {
            const profile = JSON.parse(storedProfile);
            document.getElementById("schoolName").value = profile.schoolName || "";
            document.getElementById("schoolType").value = profile.schoolType || "";
            document.getElementById("schoolAddress").value = profile.schoolAddress || "";
            document.getElementById("principalName").value = profile.principalName || "";
            document.getElementById("principalMobile").value = profile.principalMobile || "";
            
            if (profile.schoolLogo) {
                await setPreview("schoolLogo", profile.schoolLogo);
            }
            if (profile.principalSignature) {
                await setPreview("principalSignature", profile.principalSignature);
            }
        } catch(e) {
            console.error("School profile load error:", e);
        }
    }

    // Restore Student dataset table array variables
   const saved =
JSON.parse(localStorage.getItem("school-id-list"));

if(saved){

    const hours =
        (Date.now()-saved.savedAt)/(1000*60*60);

    if(hours<24){

        studentsData=saved.students || [];

    }else{

        localStorage.removeItem("school-id-list");

        studentsData=[];

    }

}else{

    studentsData=[];

}
    if (studentsData.length > 0) {
        let maxIdNum = 0;
        studentsData.forEach(s => {
            const num = parseInt(s.id.replace("card-", ""), 10);
            if (!isNaN(num) && num > maxIdNum) maxIdNum = num;
        });
        cardCounter = maxIdNum + 1;
    }
    updateTable();
});

function getSchoolProfileObject() {
    return {
        schoolName: document.getElementById("schoolName").value,
        schoolType: document.getElementById("schoolType").value,
        schoolAddress: document.getElementById("schoolAddress").value,
        principalName: document.getElementById("principalName").value,
        principalMobile: document.getElementById("principalMobile").value,
        schoolLogo: document.getElementById("schoolLogo").value,
        principalSignature: document.getElementById("principalSignature").value
    };
}

function saveSchoolProfile() {
    const profile = getSchoolProfileObject();
    localStorage.setItem("school-profile", JSON.stringify(profile));
    alert("💾 School Profile saved successfully!");
}

function autoSaveSchoolProfileSilent() {
    const profile = getSchoolProfileObject();
    localStorage.setItem("school-profile", JSON.stringify(profile));
}

function syncStudentsToLocalStorage() {
    localStorage.setItem("school-id-list", JSON.stringify(studentsData));
}

async function generateCard() {
  if (studentsData.length >= 100 && !editingStudentId) {
      alert("Maximum 100 Student ID Cards Allowed.");
      return;
  }

  const form = document.getElementById('idCardForm');
  if (!form.checkValidity()) {
    alert('Please fill in all required fields');
    return;
  }

  const studentPhotoUrl = document.getElementById("studentPhoto").value;

  if (editingStudentId) {
      const index = studentsData.findIndex(s => s.id === editingStudentId);
      if (index !== -1) {
          studentsData[index] = {
              id: editingStudentId,
              studentName: document.getElementById('studentName').value,
              fatherName: document.getElementById('fatherName').value,
              dob: document.getElementById('dob').value,
              className: document.getElementById('className').value,
              mobileNumber: document.getElementById('mobileNumber').value,
              address: document.getElementById('address').value,
              studentPhotoUrl: studentPhotoUrl
          };
      }
      editingStudentId = null;
  } else {
      const studentData = {
        id: `card-${cardCounter++}`,
        studentName: document.getElementById('studentName').value,
        fatherName: document.getElementById('fatherName').value,
        dob: document.getElementById('dob').value,
        className: document.getElementById('className').value,
        mobileNumber: document.getElementById('mobileNumber').value,
        address: document.getElementById('address').value,
        studentPhotoUrl: studentPhotoUrl
      };
      studentsData.push(studentData);
  }

  syncStudentsToLocalStorage();
  updateTable();
  clearForm();
}

function updateTable() {
  const tableBody = document.getElementById('studentTableBody');
  tableBody.innerHTML = '';

  studentsData.forEach(student => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${student.studentName}</td>
      <td>${student.fatherName}</td>
      <td>${student.dob}</td>
      <td>${student.className}</td>
      <td>${student.mobileNumber}</td>
      <td>${student.address}</td>
      <td>
        <button class="preview-btn" onclick="previewSingleCard('${student.id}')" style="padding: 5px 10px; color: white; border: none; border-radius: 4px; margin-right:2px;">👁 Preview</button>
        <button onclick="editCard('${student.id}')" style="padding: 5px 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; margin-right:2px;">Edit</button>
        <button class="delete-btn" onclick="deleteCard('${student.id}')" style="padding: 5px 10px;">Delete</button>
      </td>
    `;
    tableBody.appendChild(row);
  });
}

// Runtime dynamic structural payload compilation engine merging student parameters with school configuration
async function previewSingleCard(cardId) {
    const student = studentsData.find(s => s.id === cardId);
    if (!student) return;

    // Direct active load snapshot derivation parsing runtime rules explicitly
    const profile = getSchoolProfileObject();

    revokeUnusedURLs();
    const targetNode = document.getElementById("popupCardInjectTarget");
    targetNode.innerHTML = "<p style='color:white;text-align:center;'>Loading ID Card Assets...</p>";
    document.getElementById("previewCardModal").style.display = "flex";

    const logoUrl = await getObjectURL(profile.schoolLogo, defaultSchoolLogo);
    const signUrl = await getObjectURL(profile.principalSignature, defaultSignature);
    const photoUrl = await getObjectURL(student.studentPhotoUrl, defaultStudentPhoto);

    targetNode.innerHTML = `
      <div class="id-card">
        <div class="id-card-header">
          <img src="${logoUrl}" alt="School Logo">
          <div>
            <h3 style="margin:0; font-size:16px;">${profile.schoolName || "---"}</h3>
            <p style="margin:2px 0 0 0; font-size:12px;">(${profile.schoolType || "---"})</p>
            <p style="margin:2px 0 0 0; font-size:11px;">${profile.schoolAddress || "---"}</p>
          </div>
        </div>
        <div class="id-card-content">
          <img src="${photoUrl}" alt="Student Photo" style="width:100px; height:100px; border-radius: 8px; margin-bottom: 10px; object-fit:cover; display:block; background:#f0f0f0;">
          <p><strong>Student's Name:</strong> ${student.studentName}</p>
          <p><strong>Father's Name:</strong> ${student.fatherName}</p>
          <p><strong>Date of Birth:</strong> ${student.dob}</p>
          <p><strong>Class:</strong> ${student.className}</p>
          <p><strong>Mobile Number:</strong> ${student.mobileNumber}</p>
          <p><strong>Address:</strong> ${student.address}</p>
        </div>
        <div class="id-card-footer">
          <p><img src="${signUrl}" alt="Principal Signature" style="width: 70px; height: 25px; vertical-align: middle; object-fit:contain; margin-right:5px;"> ${profile.principalName || "---"}</p>
          <p style="margin:4px 0 0 0;">Mo. ${profile.principalMobile || "---"}</p>
        </div>
      </div>
    `;
}

function closePreviewModal() {
    document.getElementById("previewCardModal").style.display = "none";
    document.getElementById("popupCardInjectTarget").innerHTML = "";
    revokeUnusedURLs();
}

function clearForm() {
  // Clear student form parameters explicitly while preserving school parameters untouchable
  document.getElementById('idCardForm').reset();
  editingStudentId = null;
  clearPreview("studentPhoto");
}

function deleteCard(cardId) {
  if (confirm('Are you sure you want to delete this student record?')) {
    studentsData = studentsData.filter(student => student.id !== cardId);
    syncStudentsToLocalStorage();
    updateTable();
  }
}

async function editCard(cardId) {
  const student = studentsData.find(student => student.id === cardId);
  if (student) {
    editingStudentId = cardId;
    
    document.getElementById('studentName').value = student.studentName;
    document.getElementById('fatherName').value = student.fatherName;
    document.getElementById('dob').value = student.dob;
    document.getElementById('className').value = student.className;
    document.getElementById('mobileNumber').value = student.mobileNumber;
    document.getElementById('address').value = student.address;

    await setPreview("studentPhoto", student.studentPhotoUrl);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function addNewCard() {
  clearForm();
  document.getElementById('studentName').focus();
}

function generateAllCardsPage() {

    if (studentsData.length === 0) {
        alert("Please add at least one student before exporting.");
        return;
    }

    if (studentsData.length > 100) {
        alert("Maximum 100 Student ID Cards Allowed.");
        return;
    }

    autoSaveSchoolProfileSilent();

    // Current list ko bhi latest state me save kar do
    syncStudentsToLocalStorage();

    const batchPayload = {
        schoolProfile: getSchoolProfileObject(),
        students: studentsData
    };

    try {

        const token = crypto.randomUUID();

        localStorage.setItem(
            "school-id-" + token,
            JSON.stringify(batchPayload)
        );

        // ❌ Is line ko bilkul mat likhiye
        // localStorage.removeItem("school-id-list");

        window.location.href=
selectedTemplate+"?token="+token;

    } catch (err) {

        alert(err.message);

    }

}
function syncStudentsToLocalStorage(){

    const data = {
        savedAt: Date.now(),
        students: studentsData
    };

    localStorage.setItem(  
        "school-id-list",
        JSON.stringify(data)
    );

}
function clearAllLocalStorage() {
    if (!confirm("⚠️ This will delete ALL LocalStorage data for this website context.\n\nDo you wish to continue?")) {
        return;
    }
    localStorage.clear();
    alert("✅ Storage structures cleared successfully.");
    location.reload();
}
