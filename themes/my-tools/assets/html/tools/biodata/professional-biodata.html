        <div class="hero-section" id="heroBlueprint">
            <div class="hero-info">
                <img id="religiousSymbol" class="religious-symbol" crossorigin="anonymous" src="">
                <div class="top-header">
                    <div class="top-header-title">BIODATA</div>
                    <div class="top-header-underline"></div>
                    <div id="fullName" class="hero-name"></div>
                <div class="hero-subtitle" id="about">Simple and Family Oriented Person</div>

            <div class="profile-photo" id="selectPhoto">

        </div>

        <div class="biodata-section" id="secFamily">
            <div class="section-title">Family Details</div>
            <div id="familyInfo" class="info-grid"></div>
        </div>

        <div class="biodata-section" id="secContact">
