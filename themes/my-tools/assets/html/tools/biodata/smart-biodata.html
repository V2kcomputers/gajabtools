<div id="blueprintContainer">
        
        <!-- मुख्य कार्ड -->
        <div class="biodata-card">
            <div class="inner-border">
                
                <!-- हेडर -->
                <div class="card-header">
                    <img id="displaySymbol" src="/symbols/om.png" alt="धार्मिक प्रतीक" class="symbol-img">
                    <h1>|| विवाह बायोडाटा ||</h1>
                </div>

                <!-- प्रोफ़ाइल हाइलाइट -->
                <div class="profile-overview">
                    <div>
                        <div class="candidate-name" id="displayName">-</div>
                        <div class="candidate-intro" id="displayAbout"></div>
                    </div>
                    <img id="displayPhoto" src="" alt="प्रोफ़ाइल फ़ोटो" class="profile-photo">
                </div>

                <!-- 1. सामान्य जानकारी -->
                <div class="section-container" id="secBasic">
                    <div class="section-title">👤 सामान्य जानकारी</div>
                    <div class="info-grid" id="basicInfoGrid"></div>
                </div>

                <!-- 2. व्यक्तिगत विवरण -->
                <div class="section-container" id="secPersonal">
                    <div class="section-title">📜 व्यक्तिगत विवरण</div>
                    <div class="info-grid" id="personalInfoGrid"></div>
                </div>

                <!-- 3. शिक्षा एवं व्यवसाय -->
                <div class="section-container" id="secEducation">
                    <div class="section-title">🎓 शिक्षा एवं व्यवसाय</div>
                    <div class="info-grid" id="educationInfoGrid"></div>
                </div>

                <!-- 4. पारिवारिक विवरण -->
                <div class="section-container" id="secFamily">
                    <div class="section-title">👨‍👩‍👧‍👦 पारिवारिक विवरण</div>
                    <div class="info-grid" id="familyInfoGrid"></div>
                </div>

                <!-- 5. संपर्क विवरण -->
                <div class="section-container" id="secContact">
                    <div class="section-title">📞 संपर्क विवरण</div>
                    <div class="info-grid" id="contactInfoGrid"></div>
                </div>

            </div>
        </div>

        <!-- एक्शन बटन -->
        <div class="print-btn-container">
            <button class="btn btn-edit" onclick="history.back()">✏️ फ़ॉर्म बदलें (Edit)</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ प्रिंट / PDF सेव करें</button>
        </div>

    </div>
